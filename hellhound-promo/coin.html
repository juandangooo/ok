<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spinning Logo Coin</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111}

  /* ---- the coin ---- */
  .coin{width:180px;height:186px;perspective:700px}           /* perspective = how "3D" the spin looks */
  .coin .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
  .coin .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
  .coin .back{transform:rotateY(180deg)}
  .coin .logo{height:100%}
  .coin .qr{width:94%;border-radius:6px}

  /* optional: white outline around the logo for dark backgrounds */
  .outline{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
</style>
</head>
<body>

<div class="coin">
  <div class="flip" id="flip">
    <div class="face"><img class="logo outline" src="brand/mark.png" alt="Hellhound Audio"></div>
    <div class="face back"><img class="qr" src="brand/qr.png" alt="Scan to visit hellhoundaudio.com"></div>
  </div>
</div>

<script>
// ---- timing (seconds) ----
const CYCLE    = 10;    // one full loop: logo -> QR -> logo
const SPIN_1   = 3.6;   // when it starts spinning to the QR
const SPIN_2   = 8.6;   // when it starts spinning back to the logo
const SPIN_DUR = 1.4;   // how long each spin takes
const TURNS    = 540;   // degrees per spin (540 = 1.5 turns, always lands on the other face)
const BOB_PX   = 7;     // up/down float distance
const SWAY_DEG = 10;    // gentle idle wobble

// smooth ease-in-out (cubic-bezier .65,0,.35,1)
function ease(t){
  t = Math.min(1, Math.max(0, t));
  return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
}
const prog = (t, a, d) => (t - a) / d;

const flip = document.getElementById('flip');
const t0 = performance.now();

function frame(now){
  const t   = (now - t0) / 1000;
  const cyc = t % CYCLE;
  const spin = ease(prog(cyc, SPIN_1, SPIN_DUR)) * TURNS
             + ease(prog(cyc, SPIN_2, SPIN_DUR)) * TURNS;
  const bob  = Math.sin(t * 1.5) * BOB_PX;
  const sway = Math.sin(t * 1.1) * SWAY_DEG;
  flip.style.transform = `translateY(${bob}px) rotateY(${spin + sway}deg)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
