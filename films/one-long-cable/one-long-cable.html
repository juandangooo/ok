<!doctype html>
<meta charset="utf-8">
<title>one long cable</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:auto;height:min(86vh,900px);background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="core.js"></script>
<script src="gear.js"></script>
<script src="photos.js"></script>
<script>
'use strict';
// ============================================================
// ONE LONG CABLE - Hellhound Audio
//
// Subject: the kit that leaves the shop. Named, drawn so an engineer recognises it, and
//          intercut with Hellhound's own footage screened to one ink so the photographs
//          print alongside the drawings instead of sitting on top of them.
// Format: 9:16, 1080x1920 logical, drawn 12 fps, output 24 fps, 27.5 s
// Look: riso, two chalk-on-navy blueprint cutaways, single-ink photographic plates.
// Anchor: THE CABLE. Same entry point on the top edge and exit on the bottom edge in every
//         shot, so a hard cut never breaks it.
// Kit on screen: Allen & Heath SQ-7, Behringer X32, QSC K12.2, JBL SRX906LA flown column,
//         JBL SRX918S subs, mic stands, handhelds, wireless receivers and their antennas.
//
// BEAT SHEET
// t      dur   scene      what is in it                                          sound
// 0.00   2.50  shop       the shelf: K12.2s, a sub, road cases, wireless, stands  low plucks
// 2.50   1.50  plMixer    PLATE: the desk's own meter screen                      pluck + rise
// 4.00   2.50  desks      SQ-7 and X32, faders riding                             beat starts
// 6.50   1.50  stripBlue  BLOT: a channel strip opened up                         55Hz swell
// 8.00   2.00  plFront    PLATE: the Primark shopfront, array flown over it       bright
// 10.00  2.00  primark    the opening: SRX906LA column, subs, K12 fills           full beat
// 12.00  1.50  plCrowd    PLATE: the crowd it was all for                         claps
// 13.50  2.00  mics       stands rise, wireless antennas, RF you cannot see       open chords
// 15.50  1.50  boxBlue    BLOT: the array box opened up                           55Hz swell
// 17.00  1.50  smallShow  the small show: K12.2 on a stick, sub, stands, handheld  full beat
// 18.50  2.50  montage    IRIS: ten more rooms, four a second                     one note a card
// 21.00  2.25  quiet      the empty room before doors. One mic. Ripples.          one note, then air
// 23.25  1.50  home       back on the shelf, coiled                               resolve
// 24.75  2.75  signoff    the mark, then hellhound / audio                        long dyad
// ============================================================

// ===================== PALETTE =====================
// ONE-LINE BRAND SWAP. Measured off Hellhound's own reel: console blue, the lit fader caps in
// magenta and amber, navy. Replace these four and the whole film re-derives.
const BRAND_INKS = ['#0b5fa5', '#ff3d8b', '#ffc233', '#141a33'];
usePalette(makePalette({
  inks: BRAND_INKS,
  accents: [BRAND_INKS[1], '#00c2b2', BRAND_INKS[2], BRAND_INKS[0]],
  fills: [BRAND_INKS[1], BRAND_INKS[0], BRAND_INKS[2], '#00c2b2', '#ff6c2f', '#5b4b9a'],
  ink: BRAND_INKS[3], shade: BRAND_INKS[3], night: '#101833', blush: BRAND_INKS[1],
  paper: '#f0ece2', light: '#fff7d8', chalk: '#e9f0ff', chalkDim: '#7f93c8',
  guide: 'rgba(20,26,51,.45)',
}, 'risoPop'));
const INK = i => PAL.inks[i];
const poly = pts => polyPath(pts, true);

// ===================== THE ANCHOR =====================
const CIN = () => [W * .26, -40], COUT = () => [W * .74, H + 40];
function cablePts(a, b, n = 110) { const p0 = CIN(), p3 = COUT(), out = []; for (let k = 0; k <= n; k++) out.push(bez(p0, a, b, p3, k / n)); return out; }
function cable(c, a, b, o = {}) {
  const { color = INK(3), w = 19, seed = 3, p = 1 } = o, pts = cablePts(a, b);
  crayon(c, pts.slice(0, Math.max(2, Math.round(pts.length * p))), color, w, seed);
}

// ===================== RISO HELPERS =====================
const dots = (c, path, box, o = {}) => dotScreen(c, path, box, { cell: o.cell ?? 11, color: o.color ?? INK(0), density: o.density ?? .50, angle: o.angle ?? .26, jitter: o.jitter ?? .5, seed: o.seed ?? 1, alpha: o.al ?? 1 });
function mass(c, pts, o = {}) {
  const { color = INK(0), cell = 11, density = .52, angle = .26, seed = 1, rim = null, rimW = 4 } = o;
  const p = poly(pts), xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  dots(c, p, [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)], { color, cell, density, angle, seed });
  if (rim) crayon(c, pts, rim, rimW, seed + 5, true);
}
function risoCard(c, paint, seed = 1) {
  paper(c); const angles = [.26, 1.31, 0];
  for (let k = 0; k < 3; k++) { const P = plate(), g = P.getContext('2d');
    g.save(); g.setTransform(S, 0, 0, S, 0, 0); g.fillStyle = '#000'; paint(g, k); g.restore();
    printPlate(c, P, { cell: 11, ink: INK(k), angle: angles[k], seed: seed + k * 9, maxCov: .70 }); }
}
const crowdRow = (c, y, n, seed, color = INK(3), r = 26) => { const rr = rng(seed); for (let k = 0; k < n; k++) { const x = W * .04 + k * (W * .92 / (n - 1)) + (rr() - .5) * 18, h = r * (.85 + rr() * .4); c.fillStyle = color; c.beginPath(); c.arc(x, y - h * 1.6, h * .62, 0, TAU); c.fill(); c.fill(roundRectPath(x - h * .8, y - h * 1.1, h * 1.6, h * 1.5, h * .5)); } };

// ===================== THE PHOTOGRAPHS =====================
// Hellhound's own footage, screened to one ink in photos.js. Laid on the paper as prints:
// a paper border, a crayon rim, a contact shadow. They print, they do not float.
function printPlate_(c, name, x, y, wid, seed, o = {}) {
  const pl = place(name, { x, y, w: wid, rot: o.rot || 0 });
  const B = onAll(pl, [[-.035, -.05], [1.035, -.05], [1.035, 1.05], [-.035, 1.05]]);
  c.save(); c.globalAlpha = .18; c.fillStyle = INK(3); c.translate(0, 10); c.fill(poly(B)); c.restore();
  c.fillStyle = PAL.paper; c.fill(poly(B));
  photo(c, pl, { shadow: 0 });
  crayon(c, B, INK(3), 4.5, seed, true);
  if (o.tape !== false) { const t = onAll(pl, [[.36, -.10], [.64, -.10], [.64, .02], [.36, .02]]);   // a strip of tape
    c.save(); c.globalAlpha = .75; mass(c, t, { color: INK(2), density: .75, cell: 7, seed: seed + 2 }); c.restore(); }
  return pl;
}

// ===================== THE MARK =====================
// LOGO SLOT. Drop the real mark into photos.js as `logo` (registerPhoto("logo", {...})) and
// this draws it everywhere, at the right size, with no other change. Until then it hand-letters
// the wordmark so the shots are composed correctly.
function logoMark(c, x, y, h, o = {}) {
  if (typeof PHOTOS !== 'undefined' && PHOTOS && PHOTOS.logo) { photo(c, place('logo', { x, y, h }), { shadow: o.flat ? 0 : .2 }); return; }
  c.save();
  if (!o.flat) { crayon(c, ellPts(x, y, h * 1.05, h * 1.05, 0, 64), INK(3), h * .055, 71, true);
    dashedRing(c, x, y, h * 1.22, alpha(INK(1), .7), 72, [16, 12], 2.5); }
  const pr = o.progress ?? 1, wa = 'hellhound'.slice(0, Math.round(9 * clamp(pr * 1.7, 0, 1))), wb = 'audio'.slice(0, Math.round(5 * clamp(pr * 1.7 - .7, 0, 1)));
  handText(c, wa, x, y + h * .06, { size: h * .46, ink: INK(3), ink2: INK(1), align: 'center' });
  handText(c, wb, x, y + h * .52, { size: h * .26, ink: INK(3), ink2: INK(0), align: 'center' });
  c.restore();
}

// ===================== SCENES =====================
// 1. the shelf it all lives on
function sShop(c, tau, i) {
  paper(c);
  crayon(c, [[W * .04, H * .30], [W * .96, H * .30]], INK(3), 6, 20);
  crayon(c, [[W * .04, H * .585], [W * .96, H * .585]], INK(3), 6, 21);
  k12(c, 'riso', W * .16, H * .285, H * .085, 40);                                    // two K12.2 on the top shelf
  k12(c, 'riso', W * .35, H * .285, H * .085, 41, { ink: INK(0) });
  wirelessRack(c, 'riso', W * .72, H * .245, W * .20, 44);                            // and the wireless rack
  roadCase(c, 'riso', W * .22, H * .49, W * .34, H * .15, 50, { mark: true });         // road cases on the lower shelf
  roadCase(c, 'riso', W * .62, H * .49, W * .30, H * .15, 52, { ink: INK(1) });
  sub918(c, 'riso', W * .30, H * .70, W * .34, 56);                                   // the sub on the floor
  for (const [k, x] of [W * .62, W * .72, W * .82].entries()) micStand(c, 'riso', x, H * .78, H * .17, 60 + k, { boom: -.6 - k * .12 });
  const cx = W * .5, cy = H * .89, unwind = sm(.4, 1.6, tau, easeOut);
  for (let k = 0; k < 5; k++) { c.globalAlpha = 1 - unwind * .6; crayon(c, ellPts(cx, cy, W * (.09 + k * .025) * (1 - unwind * .2), W * (.036 + k * .01), 0, 44), INK(3), 7, 66 + k, true); }
  c.globalAlpha = 1;
  cable(c, [W * .10, H * .74], [W * .96, H * .80], { p: lerp(.34, 1, sm(0, 1.8, tau, easeOut)) });
}
// 2. PLATE: the desk's own screen
function sPlMixer(c, tau, i) {
  paper(c);
  printPlate_(c, 'mixer', W * .5, H * .40, W * .86, 81, { rot: -.025 });
  cable(c, [W * .06, H * .62], [W * .98, H * .72], {});
  c.save(); c.globalAlpha = .5; construction(c, W * .5, H * .40, W * .34, 82); c.restore();
}
// 3. the desks, named by their silhouettes
function sDesks(c, tau, i) {
  paper(c);
  const a = sm(.1, .8, tau, easeOut), b = sm(.9, 1.6, tau, easeOut);
  c.save(); c.globalAlpha = a; sq7(c, 'riso', W * .48, lerp(-H * .1, H * .30, a), W * .44, 100, { rot: -.05 }); c.restore();
  c.save(); c.globalAlpha = b; x32(c, 'riso', W * .52, lerp(H * 1.1, H * .62, b), W * .46, 140, { rot: .04 }); c.restore();
  if (tau > 1.7) { c.save(); c.globalAlpha = sm(1.7, 2.3, tau) * .8; dashedRing(c, W * .48, H * .30, W * .40, alpha(INK(1), .8), 175); c.restore(); }
  cable(c, [W * .04, H * .46], [W * .99, H * .56], {});
}
// 4. BLOT: a channel strip, opened up
const L1 = layer(), L2 = layer();
function stripBlueprint(b) {
  night(b, PAL.night, 31);
  const x = W * .22, y = H * .16, w = W * .56, h = H * .64;
  b.save(); b.strokeStyle = PAL.chalk; b.lineWidth = 3; wob(b, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], 2, 181, true); b.stroke();
  b.lineWidth = 2.2; b.strokeStyle = alpha(PAL.chalk, .85);
  for (let k = 0; k < 3; k++) { const cy = y + h * (.09 + k * .10); wob(b, ellPts(x + w * .26, cy, w * .085, w * .085, 0, 30), 1.2, 182 + k, true); b.stroke();
    b.beginPath(); b.moveTo(x + w * .26, cy); b.lineTo(x + w * .26 + Math.cos(-2.1 + k * .6) * w * .085, cy + Math.sin(-2.1 + k * .6) * w * .085); b.stroke(); }
  const ex = x + w * .52, ey = y + h * .10, ew = w * .40, eh = h * .16;                       // the EQ curve
  wob(b, [[ex, ey + eh], [ex + ew, ey + eh]], 1, 190); b.stroke();
  const cur = []; for (let k = 0; k <= 28; k++) { const t = k / 28; cur.push([ex + t * ew, ey + eh * .55 - Math.sin(t * Math.PI * 1.6) * eh * .42 + Math.sin(t * 9) * 2]); }
  b.strokeStyle = PAL.chalk; b.lineWidth = 2.6; wob(b, cur, 1.2, 191); b.stroke();
  const fy0 = y + h * .46, fy1 = y + h * .92;                                                  // the fader
  b.lineWidth = 2; wob(b, [[x + w * .5, fy0], [x + w * .5, fy1]], 1, 195); b.stroke();
  const fk = lerp(fy1, fy0, .30 + .46);
  wob(b, [[x + w * .34, fk], [x + w * .66, fk], [x + w * .66, fk + H * .030], [x + w * .34, fk + H * .030]], 1.3, 196, true); b.stroke();
  for (let k = 0; k < 6; k++) { const yy = y + h * (.50 + k * .07); wob(b, [[x + w * .72, yy], [x + w * .90, yy]], 1, 200 + k); b.stroke(); }   // the aux sends
  b.restore();
  hexLattice(b, [x + w * .06, y + h * .62, w * .24, h * .30], 12, alpha(PAL.chalk, .35), .7, .8);
  b.save(); b.globalAlpha = .7; construction(b, x + w * .5, fk, w * .3, 210, alpha(PAL.chalk, .5)); b.restore();
  crayon(b, cablePts([W * .04, H * .46], [W * .99, H * .56]), alpha(PAL.chalk, .85), 8, 3);
}
function sStripBlue(c, tau, i) {
  sDesks(L1.getContext('2d'), 2.4, i); stripBlueprint(L2.getContext('2d'));
  blit(c, L1); blot(c, L2, W * .5, H * .44, lerp(0, H * 1.15, sm(0, .8, tau, easeOut)), 32);
}
// 5. PLATE: the shopfront, with what we flew over it
function sPlFront(c, tau, i) {
  paper(c);
  printPlate_(c, 'primark_front', W * .5, H * .46, W * .88, 221, { rot: .018 });
  const drop = sm(.15, 1.1, tau, easeOut);
  arrayColumn(c, 'riso', W * .22, lerp(H * .06, H * .17, drop), W * .19, 4, 230, { spread: .13 });
  arrayColumn(c, 'riso', W * .78, lerp(H * .06, H * .17, drop), W * .19, 4, 240, { spread: -.13 });
  crowdRow(c, H * .95, 8, 250, INK(3), 34);
  cable(c, [W * .06, H * .70], [W * .98, H * .78], {});
}
// 6. the opening itself
function sPrimark(c, tau, i) {
  paper(c);
  mass(c, [[0, H * .20], [W, H * .20], [W, H * .33], [0, H * .33]], { color: INK(0), density: .62, seed: 261 });   // the fascia
  for (let k = 0; k < 6; k++) mass(c, [[W * (.08 + k * .145), H * .225], [W * (.08 + k * .145) + W * .09, H * .225], [W * (.08 + k * .145) + W * .09, H * .305], [W * (.08 + k * .145), H * .305]], { color: INK(2), density: .9, seed: 265 + k });
  mass(c, [[0, H * .33], [W, H * .33], [W, H * .74], [0, H * .74]], { color: INK(0), density: .18, seed: 262 });   // glass
  for (let k = 1; k < 4; k++) crayon(c, [[W * k / 4, H * .33], [W * k / 4, H * .74]], alpha(INK(3), .45), 3, 270 + k);
  crayon(c, [[W * .06, H * .36], [W * .94, H * .36]], INK(3), 6, 275);                                             // the flown bar
  arrayColumn(c, 'riso', W * .27, H * .38, W * .21, 5, 280, { spread: .12 });
  arrayColumn(c, 'riso', W * .73, H * .38, W * .21, 5, 290, { spread: -.12 });
  sub918(c, 'riso', W * .14, H * .80, W * .26, 300);
  sub918(c, 'riso', W * .86, H * .80, W * .26, 301);
  k12(c, 'riso', W * .42, H * .72, H * .060, 305, { ink: INK(1) });                                                 // K12.2 fills on sticks
  crayon(c, [[W * .42, H * .72], [W * .42, H * .85]], INK(3), 5, 306);
  k12(c, 'riso', W * .58, H * .72, H * .060, 307, { ink: INK(1) });
  crayon(c, [[W * .58, H * .72], [W * .58, H * .85]], INK(3), 5, 308);
  crowdRow(c, H * .99, 10, 310, INK(3), 30);
  cable(c, [W * .04, H * .64], [W * .99, H * .82], {});
}
// 7. PLATE: who it was for
function sPlCrowd(c, tau, i) {
  paper(c);
  printPlate_(c, 'crowd', W * .5, H * .44, W * .86, 321, { rot: -.02 });
  cable(c, [W * .06, H * .70], [W * .98, H * .76], {});
  if (tau > .5) { c.save(); c.globalAlpha = sm(.5, 1.1, tau) * .7; ripples(c, W * .5, H * .44, [W * .34, W * .46], alpha(INK(1), .8), 325, 3); c.restore(); }
}
// 8. the mics, and the part of the job nobody can see
function sMics(c, tau, i) {
  paper(c);
  crayon(c, [[0, H * .82], [W, H * .82]], INK(3), 6, 331);
  const n = 4;
  for (let k = 0; k < n; k++) { const up = sm(.1 + k * .16, .8 + k * .16, tau, easeOut);
    micStand(c, 'riso', W * (.16 + k * .23), H * .82 + (1 - up) * H * .30, H * .26, 340 + k * 4, { boom: -.5 - k * .16 }); }
  wirelessRack(c, 'riso', W * .5, H * .22, W * .26, 360, { rf: sm(.8, 2.0, tau) });
  handheld(c, 'riso', W * .12, H * .46, H * .045, 370, { rot: -.5 });
  handheld(c, 'riso', W * .88, H * .44, H * .045, 371, { rot: .4 });
  cable(c, [W * .02, H * .58], [W * .99, H * .70], {});
}
// 9. BLOT: the box
function boxBlueprint(b) {
  night(b, PAL.night, 31);
  const x = W * .18, y = H * .24, w = W * .64, h = H * .42, pts = [[x, y], [x + w, y], [x + w - w * .10, y + h], [x + w * .10, y + h]];
  b.save(); b.strokeStyle = PAL.chalk; b.lineWidth = 3; wob(b, pts, 2, 381, true); b.stroke();
  b.strokeStyle = alpha(PAL.chalk, .8); b.lineWidth = 2.4;
  wob(b, ellPts(x + w * .30, y + h * .42, w * .19, w * .19, 0, 60), 1.6, 382, true); b.stroke();
  wob(b, ellPts(x + w * .30, y + h * .42, w * .09, w * .09, 0, 40), 1.4, 383, true); b.stroke();
  wob(b, [[x + w * .58, y + h * .26], [x + w * .92, y + h * .38], [x + w * .92, y + h * .54], [x + w * .58, y + h * .66]], 1.8, 384, true); b.stroke();
  for (const s of [0, 1]) { const yy = y + h * (.06 + s * .86);
    wob(b, [[x + w * .12, yy], [x + w * .88, yy]], 1.4, 385 + s); b.stroke();
    for (const px of [x + w * .18, x + w * .82]) { b.beginPath(); b.arc(px, yy, 8, 0, TAU); b.stroke(); } }
  b.restore();
  hexLattice(b, [x + w * .10, y + h * .70, w * .80, h * .22], 11, alpha(PAL.chalk, .5), .8, .9);
  b.save(); b.globalAlpha = .7; construction(b, x + w * .30, y + h * .42, w * .30, 390, alpha(PAL.chalk, .5)); b.restore();
  b.save(); b.strokeStyle = alpha(PAL.chalk, .6); b.lineWidth = 1; for (const q of [[x, y], [x + w, y], [x + w * .30, y + h * .42]]) cross(b, q[0], q[1], 14); b.restore();
  crayon(b, cablePts([W * .02, H * .58], [W * .99, H * .70]), alpha(PAL.chalk, .85), 8, 3);
}
function sBoxBlue(c, tau, i) {
  sMics(L1.getContext('2d'), 1.9, i); boxBlueprint(L2.getContext('2d'));
  blit(c, L1); blot(c, L2, W * .5, H * .44, lerp(0, H * 1.15, sm(0, .8, tau, easeOut)), 32);
}
// 10. the small show: the kit that turns up to a corporate room or a store opening
function sSmallShow(c, tau, i) {
  paper(c);
  crayon(c, [[0, H * .80], [W, H * .80]], INK(3), 6, 601);
  mass(c, [[W * .08, H * .28], [W * .56, H * .28], [W * .56, H * .60], [W * .08, H * .60]], { color: INK(0), density: .55, seed: 602, rim: INK(3), rimW: 5 });   // the screen
  mass(c, [[W * .64, H * .54], [W * .79, H * .54], [W * .82, H * .80], [W * .61, H * .80]], { color: INK(1), density: .70, seed: 603, rim: INK(3), rimW: 5 });   // the lectern
  const up = sm(.1, .95, tau, easeOut), ky = lerp(H * .80, H * .44, up);
  crayon(c, [[W * .88, H * .80], [W * .88, ky]], INK(3), 6, 604);                      // K12.2 up on a pole
  k12(c, 'riso', W * .88, ky, H * .080, 605, { ink: INK(1) });
  sub918(c, 'riso', W * .17, H * .90, W * .26, 606);                                    // a sub tucked under the screen
  micStand(c, 'riso', W * .70, H * .80, H * .21, 607, { boom: -.72 });
  handheld(c, 'riso', W * .40, H * .70, H * .052, 608, { rot: .6 });
  crowdRow(c, H * .98, 7, 609, INK(3), 26);
  cable(c, [W * .06, H * .66], [W * .98, H * .76], {});
}

// 11. IRIS: ten more rooms
const VENUES = [
  { m: [[.10, .52], [.30, .30], [.50, .52]], a: [[.30, .40, .05]] },
  { m: [[.06, .58], [.94, .58], [.94, .40], [.06, .40]], a: [[.5, .30, .07]] },
  { m: [[.10, .62], [.44, .28], [.78, .62]], a: [[.72, .24, .06]] },
  { m: [[.14, .56], [.50, .26], [.86, .56]], a: [[.50, .38, .08]] },
  { m: [[.08, .50], [.92, .50], [.92, .66], [.08, .66]], a: [[.20, .34, .05]] },

const venueCards = VENUES.map((v, n) => (cc, t, i) => {
  const M = () => poly(v.m.map(q => [q[0] * W, q[1] * H])), GYc = H * .72;

    if (k === 0) { g.fillRect(0, H * .14, W, GYc - H * .14); g.fillStyle = '#fff'; g.fill(M()); g.fillRect(0, GYc, W, H - GYc); g.fillStyle = '#000'; }

// 12. the empty room before doors. The whole film is for this shot.
function sQuiet(c, tau, i) {

// ===================== SCORE =====================
function score(ac, t0, dest) {
  const master = ac.createGain(); master.gain.value = .55; master.connect(dest);
  const r = rng(11); let acc = 0;
  const N = (t, o, s, d, g, ty) => note(ac, master, pentHz(o, s), t0, t, d, ty || 'triangle', g);
  for (const s of TIMELINE) {
    const a = acc, d = s.dur;
    if (s.name === 'shop' || s.name === 'home') for (let t = 0; t < d; t += .5) N(a + t, 0, r() * 5 | 0, .7, .17);
    if (s.name === 'plMixer' || s.name === 'plFront') { N(a, 1, 2, .8, .2); for (let t = 0; t < d; t += .5) N(a + t, 0, 0, .6, .14, 'sine'); }
    if (s.name === 'desks' || s.name === 'primark' || s.name === 'mics' || s.name === 'smallShow') {
      for (let t = 0; t < d; t += .25) N(a + t, 1, (t * 4) % 5 | 0, .22, .07, 'square');
      for (let t = 0; t < d; t += .5) N(a + t, 0, 0, .6, .17); }
    if (s.name === 'plCrowd') { noiseBurst(ac, master, t0, a, .35, .16, 5); for (let t = 0; t < d; t += .25) N(a + t, 2, r() * 5 | 0, .2, .09); }
    if (s.name === 'stripBlue' || s.name === 'boxBlue') { note(ac, master, 55, t0, a, d, 'sawtooth', .16); note(ac, master, 110, t0, a, d, 'sine', .11); }
    if (s.name === 'montage') for (let k = 0; k < 10; k++) N(a + k * .25, 1 + (k > 6 ? 1 : 0), k % 5, .22, .13, 'square');
    if (s.name === 'quiet') { N(a + .1, 1, 0, 1.6, .26, 'sine'); N(a + 1.2, 0, 2, 1.0, .13, 'sine'); }
    if (s.name === 'signoff') { N(a + .1, 0, 0, 2.4, .22, 'sine'); N(a + .1, 1, 2, 2.4, .15, 'sine'); }
    acc += d;
  }
}
