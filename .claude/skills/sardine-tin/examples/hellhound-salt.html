<title>Hellhound Salt Tin</title>

  :root{ --bg:#C8C0B0; --fg:#2A241E; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#131110; --fg:#E4DACA; }
  }
  :root[data-theme="dark"]{ --bg:#131110; --fg:#E4DACA; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:Jost,system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px}
  .wrap{width:100%;max-width:1000px}
  svg{width:100%;height:auto;display:block;filter:drop-shadow(0 20px 38px rgba(0,0,0,.42))}
  .cap{max-width:640px;margin:26px auto 0;text-align:center;font-size:13px;
       letter-spacing:.11em;text-transform:uppercase;opacity:.55}
</style>
</head>

    <stop offset="100%" stop-color="#CFD4D0"/>

    <stop offset="42%"  stop-color="#E5DBC5"/>
    <stop offset="100%" stop-color="#CFC2A6"/>

    <stop offset="30%" stop-color="#FFF" stop-opacity="0.04"/>
    <stop offset="64%" stop-color="#000" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.24"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.48" cy="0.42" r="0.78">
    <stop offset="50%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3A1A0C" stop-opacity="0.19"/>
  </radialGradient>

  <!-- printed edges eaten by eighty years: a small displacement, no more -->
  <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.075" numOctaves="3" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.55"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- patina: uneven blotching in the paint itself -->
  <filter id="patina" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="4" seed="17"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3"
                  stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n"/>
  </filter>
  <clipPath id="lid"><rect x="80" y="94" width="840" height="552" rx="86"/></clipPath>
</defs>
