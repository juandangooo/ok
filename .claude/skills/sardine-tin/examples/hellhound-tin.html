<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hellhound Audio Tin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo+Narrow:wght@400;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#E9E3D7; --fg:#241F1B; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#141110; --fg:#E8E0D2; }
  }
  :root[data-theme="dark"]{ --bg:#141110; --fg:#E8E0D2; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Archivo Narrow",system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;
       padding:32px 16px 48px}
  .wrap{width:100%;max-width:1000px}
  svg{width:100%;height:auto;display:block;
      filter:drop-shadow(0 18px 34px rgba(0,0,0,.36))}
  .cap{max-width:640px;margin:26px auto 0;text-align:center;
       font-size:14px;letter-spacing:.09em;text-transform:uppercase;opacity:.62}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Hellhound Audio drawn as a vintage tinned-fish can lid: red field, cream keyline frame, the HH hexagon monogram over a stack of engraved road cases">
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#F4F6F7"/>
    <stop offset="17%"  stop-color="#98A1A6"/>
    <stop offset="33%"  stop-color="#E9EDEF"/>
    <stop offset="51%"  stop-color="#7B8489"/>
    <stop offset="71%"  stop-color="#DEE3E6"/>
    <stop offset="88%"  stop-color="#8A9398"/>
    <stop offset="100%" stop-color="#C6CDD1"/>
  </linearGradient>
  <linearGradient id="chrome2" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%"   stop-color="#FBFCFC"/>
    <stop offset="30%"  stop-color="#B9C1C5"/>
    <stop offset="55%"  stop-color="#EDF1F3"/>
    <stop offset="80%"  stop-color="#8F989D"/>
    <stop offset="100%" stop-color="#D6DBDE"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.24"/>
    <stop offset="34%"  stop-color="#FFFFFF" stop-opacity="0.05"/>
    <stop offset="63%"  stop-color="#000000" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.44" r="0.74">
    <stop offset="52%"  stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
  </radialGradient>

  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"
                  stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n"/>
  </filter>

  <clipPath id="lid"><rect x="80" y="94" width="840" height="552" rx="92"/></clipPath>

  <path id="arcTop"  d="M240 148 A 1500 1500 0 0 1 760 148" fill="none"/>
  <path id="arcHero" d="M200 266 A 1100 1100 0 0 1 800 266" fill="none"/>

  <!-- ——— the HH hexagon monogram ———
       Pointy-top hexagon split down the centre into two cube faces.
       Each face carries an H skewed to that face's plane (±26.3°), so the
       pair reads as two sides of a box. Left face dark, right face light. -->
  <g id="hhmark">
    <!-- Each half of the hexagon is a trapezoid, not a parallelogram, so the H
         on it is TAPERED, not skewed: stems stay vertical and grow taller
         toward the centre seam, following the half's own taper at about half
         its rate. That is why the inner stem is longer than the outer one. -->
    <path id="hh-h" d="M-446 -218 L-358 -246 L-358 -34 L-172 -34 L-172 -305
                       L-84 -333 L-84 375 L-172 347 L-172 76 L-358 76
                       L-358 288 L-446 260 Z"/>
    <path id="hh-bevel" d="M-436 -219 V257 M-162 -303 V345 M-348 -24 H-182"/>

    <!-- left (dark) face -->
    <path d="M0 -550 L-535 -285 L-535 285 L0 550 Z" fill="#17110F"/>
    <use href="#hh-h" fill="#F1E8D5"/>
    <use href="#hh-bevel" fill="none" stroke="#17110F" stroke-width="7"/>

    <!-- right (light) face: the same H mirrored -->
    <path d="M0 -550 L535 -285 L535 285 L0 550 Z" fill="#F1E8D5"/>
    <g transform="scale(-1,1)">
      <use href="#hh-h" fill="#17110F"/>
      <use href="#hh-bevel" fill="none" stroke="#F1E8D5" stroke-width="7"/>
    </g>

    <!-- hexagon keyline + centre seam -->
    <path d="M0 -550 L-535 -285 L-535 285 L0 550 L535 285 L535 -285 Z"
          fill="none" stroke="#17110F" stroke-width="20" stroke-linejoin="round"/>
    <path d="M0 -550 V550" stroke="#17110F" stroke-width="16"/>
  </g>

  <!-- ——— road-case vocabulary ——— -->
  <!-- flight case: black body, cream extrusion edging, corner caps, latches -->
  <g id="flightcase">
    <rect x="0" y="0" width="120" height="120" fill="#17110F"/>
    <g fill="none" stroke="#F1E8D5" stroke-width="3.6">
      <rect x="0" y="0" width="120" height="120"/>
      <path d="M0 13 H120 M0 107 H120 M13 0 V120 M107 0 V120"/>
      <path d="M13 42 H107"/>
    </g>
    <g fill="#F1E8D5">
      <path d="M0 0 h26 l-13 13 h-13 Z"/><path d="M120 0 h-26 l13 13 h13 Z"/>
      <path d="M0 120 h26 l-13 -13 h-13 Z"/><path d="M120 120 h-26 l13 -13 h13 Z"/>
      <rect x="30" y="34" width="15" height="16" rx="2"/>
      <rect x="75" y="34" width="15" height="16" rx="2"/>
    </g>
    <g fill="none" stroke="#F1E8D5" stroke-width="3.2">
      <rect x="38" y="70" width="44" height="17" rx="4"/>
      <path d="M46 78 H74"/>
    </g>
  </g>

  <!-- rack case: silver extrusion, rack panel with knobs -->
  <g id="rackcase">
    <rect x="0" y="0" width="96" height="76" fill="#17110F"/>
    <g fill="none" stroke="#F1E8D5" stroke-width="3.4">
      <rect x="0" y="0" width="96" height="76"/>
      <path d="M0 11 H96 M0 65 H96"/>
      <rect x="12" y="20" width="72" height="36"/>
      <path d="M12 32 H84"/>
    </g>
    <g fill="#F1E8D5">
      <circle cx="22" cy="45" r="4.2"/><circle cx="36" cy="45" r="4.2"/>
      <circle cx="50" cy="45" r="4.2"/><circle cx="64" cy="45" r="4.2"/>
      <circle cx="78" cy="45" r="4.2"/>
      <rect x="16" y="25" width="40" height="4"/>
    </g>
  </g>

  <!-- pelican-style case: ribbed lid, twin latches, top handle -->
  <g id="pelican">
    <rect x="0" y="0" width="104" height="56" rx="9" fill="#17110F"/>
    <g fill="none" stroke="#F1E8D5" stroke-width="3.4">
      <rect x="0" y="0" width="104" height="56" rx="9"/>
      <path d="M0 22 H104"/>
      <path d="M22 2 V20 M38 2 V20 M54 2 V20 M70 2 V20 M86 2 V20"/>
      <rect x="18" y="16" width="16" height="14" rx="3"/>
      <rect x="70" y="16" width="16" height="14" rx="3"/>
      <path d="M40 0 q12 -13 24 0"/>
    </g>
  </g>

  <!-- stackable crate, tone-on-tone: field red face, deep-red side, cream keyline -->
  <g id="crate" stroke-linejoin="round">
    <rect x="0" y="0" width="104" height="36" fill="#A81A18"/>
    <g fill="none" stroke="#F1E8D5" stroke-width="3.2">
      <rect x="0" y="0" width="104" height="36"/>
      <path d="M0 10 H104"/>
      <rect x="36" y="18" width="32" height="11"/>
    </g>
    <g fill="#F1E8D5">
      <rect x="5" y="16" width="9" height="14" rx="2"/>
      <rect x="90" y="16" width="9" height="14" rx="2"/>
    </g>
  </g>
  <g id="cratetop" stroke-linejoin="round">
    <path d="M0 0 H104 L116 -13 H12 Z" fill="#7E120F"/>
    <path d="M0 0 H104 L116 -13 H12 Z" fill="none" stroke="#F1E8D5" stroke-width="3.2"/>
  </g>

  <!-- coiled cable, the shop-floor answer to Abba's water squiggles -->
  <g id="coil" fill="none" stroke="#F1E8D5" stroke-width="3.4">
    <ellipse cx="0" cy="0" rx="34" ry="13"/>
    <ellipse cx="0" cy="-7" rx="28" ry="10"/>
    <path d="M26 -10 q16 -6 22 4"/>
  </g>

  <g id="star">
    <path d="M0 -15 L4.4 -4.8 L15.2 -4.6 L6.6 2.1 L9.7 12.5 L0 6.4
             L-9.7 12.5 L-6.6 2.1 L-15.2 -4.6 L-4.4 -4.8 Z"/>
  </g>
</defs>

<!-- ————— tin body ————— -->
<rect x="50" y="64" width="900" height="612" rx="112" fill="url(#chrome)"/>
<rect x="66" y="80" width="868" height="580" rx="100" fill="none"
      stroke="#6E777C" stroke-width="3"/>
<rect x="74" y="88" width="852" height="564" rx="96" fill="none"
      stroke="#EFF3F5" stroke-width="2" opacity=".75"/>

<g clip-path="url(#lid)">
  <!-- flat spot-colour field -->
  <rect x="80" y="94" width="840" height="552" fill="#C2201D"/>

  <!-- double keyline frame -->
  <rect x="140" y="162" width="720" height="424" rx="56" fill="none"
        stroke="#F1E8D5" stroke-width="9"/>
  <rect x="153" y="175" width="694" height="398" rx="45" fill="none"
        stroke="#17110F" stroke-width="2.4" opacity=".85"/>

  <!-- ——— the stack ——— -->
  <use href="#coil" transform="translate(790,440) scale(0.9)"/>
  <use href="#coil" transform="translate(742,512) scale(1.05)"/>

  <use href="#flightcase" transform="translate(176,335) scale(0.95)"/>
  <use href="#pelican"    transform="translate(182,283) scale(0.72)"/>
  <use href="#rackcase"   transform="translate(296,379) scale(1.0)"/>
  <use href="#pelican"    transform="translate(300,331) scale(0.82)"/>

  <use href="#cratetop"   transform="translate(646,281)"/>
  <use href="#crate"      transform="translate(646,281)"/>
  <use href="#crate"      transform="translate(646,317)"/>
  <use href="#flightcase" transform="translate(646,353) scale(0.87)"/>
  <use href="#flightcase" transform="translate(760,349) scale(0.9)"/>
  <use href="#pelican"    transform="translate(764,307) scale(0.74)"/>

  <!-- shop floor -->
  <path d="M164 457 H864" stroke="#F1E8D5" stroke-width="3.4" opacity=".7"/>

  <!-- ——— the mark, sitting in front of the stack ——— -->
  <g transform="translate(500,350) scale(0.206)">
    <use href="#hhmark"/>
  </g>

  <!-- ——— type ——— -->
  <text font-family="'Archivo Black', sans-serif" font-size="19" fill="#F1E8D5"
        letter-spacing="2.2" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">PROFESSIONAL SOUND &amp; LIGHTING</textPath>
  </text>

  <text font-family="'Archivo Black', sans-serif" font-size="52" fill="#F1E8D5"
        stroke="#17110F" stroke-width="4.4" paint-order="stroke fill"
        stroke-linejoin="round" letter-spacing="5" text-anchor="middle">
    <textPath href="#arcHero" startOffset="50%">HELLHOUND</textPath>
  </text>

  <!-- AUD + bolt + O -->
  <g font-family="'Archivo Black', sans-serif" font-size="52" fill="#F1E8D5"
     stroke="#17110F" stroke-width="4.4" paint-order="stroke fill"
     stroke-linejoin="round" letter-spacing="10">
    <text x="381" y="536">AUD</text>
    <text x="566" y="536">O</text>
  </g>
  <path d="M8 -26 L-9 3 L0 3 L-7 26 L10 -4 L1 -4 Z"
        transform="translate(548,518) scale(1.16)" fill="#F1E8D5" stroke="#17110F"
        stroke-width="4.4" paint-order="stroke fill" stroke-linejoin="round"/>

  <!-- quality tally -->
  <g fill="#F1E8D5" stroke="#17110F" stroke-width="1.8">
    <use href="#star" transform="translate(890,300)"/>
    <use href="#star" transform="translate(890,350)"/>
    <use href="#star" transform="translate(890,400)"/>
  </g>

  <!-- margin code, the Porthos tic -->
  <text transform="translate(113,372) rotate(-90)" text-anchor="middle"
        font-family="'Archivo Narrow', sans-serif" font-size="15" fill="#F1E8D5"
        letter-spacing="2.4" opacity=".92">QSC K12.2 · SHURE ULX-D · CHAUVET PRO OVATION</text>

  <!-- below the frame: the one modern element, flanked by grocery copy -->
  <g font-family="'Archivo Narrow', sans-serif" font-size="16" fill="#F1E8D5">
    <rect x="150" y="605" width="138" height="23" fill="none"
          stroke="#F1E8D5" stroke-width="1.6"/>
    <text x="219" y="621" text-anchor="middle" letter-spacing="1.4" font-size="15">READY TO ROLL</text>
    <text x="866" y="621" text-anchor="end" letter-spacing="1.4" font-size="15">NET WT. ONE FULL RIG</text>
  </g>
  <text x="500" y="623" text-anchor="middle" font-family="Poppins, system-ui, sans-serif"
        font-size="20" font-weight="500" fill="#F1E8D5" letter-spacing="1"
        >www.hellhoundaudio.com</text>

  <!-- ——— ring pull: a real ring, neck and rivet, not a blob with a hole ——— -->
  <g transform="translate(258,504) scale(0.54)">
    <path fill="#000" opacity=".2"
          d="M-58 8 C -58 -22, -28 -40, 18 -40 C 72 -40, 110 -20, 110 8
             C 110 36, 72 56, 18 56 C -28 56, -58 38, -58 8 Z"/>
    <path d="M-80 -36 C -24 -58, 122 -50, 170 -20" fill="none" stroke="#F1E8D5"
          stroke-width="3" opacity=".34" stroke-linecap="round"/>
    <path fill-rule="evenodd" fill="url(#chrome2)" stroke="#2C3134" stroke-width="3.4"
          d="M-64 -2 C -64 -32, -34 -50, 12 -50 C 66 -50, 104 -30, 104 -2
             C 104 26, 66 46, 12 46 C -34 46, -64 28, -64 -2 Z
             M 34 -2 m -44 0 a 44 26 0 1 0 88 0 a 44 26 0 1 0 -88 0 Z"/>
    <path d="M-52 -14 C -46 -34, -18 -44, 8 -44" fill="none" stroke="#FBFDFD"
          stroke-width="4.5" opacity=".9" stroke-linecap="round"/>
    <circle cx="-34" cy="-2" r="15" fill="#C2CACE" stroke="#2C3134" stroke-width="3"/>
    <circle cx="-35" cy="-4" r="6.5" fill="#7F888D"/>
  </g>

  <!-- ——— finish ——— -->
  <rect x="80" y="94" width="840" height="552" filter="url(#grain)"
        opacity=".06" style="mix-blend-mode:multiply"/>
  <rect x="80" y="94" width="840" height="552" fill="url(#vig)"/>
  <rect x="80" y="94" width="840" height="552" rx="92" fill="url(#sheen)"/>
</g>
</svg>
<p class="cap">Hellhound Audio — Archetype A, Nordic spot-colour</p>
</div>
</body>
</html>
