<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conservas Cortés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Archivo+Narrow:wght@400;600&family=Baloo+2:wght@700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#EDE7DB; --fg:#2A2520; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#17140F; --fg:#E8E0D2; }
  }
  :root[data-theme="dark"]{ --bg:#17140F; --fg:#E8E0D2; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Archivo Narrow",system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;
       padding:32px 16px 48px}
  .wrap{width:100%;max-width:1000px}
  svg{width:100%;height:auto;display:block;
      filter:drop-shadow(0 18px 34px rgba(0,0,0,.34))}
  .cap{max-width:640px;margin:26px auto 0;text-align:center;
       font-size:14px;letter-spacing:.09em;text-transform:uppercase;opacity:.62}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A vintage-style sardine tin lid: Conservas Cortés, sardinas con pimientos y laurel">
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#F4F6F7"/>
    <stop offset="17%"  stop-color="#98A1A6"/>
    <stop offset="33%"  stop-color="#E9EDEF"/>
    <stop offset="51%"  stop-color="#7B8489"/>
    <stop offset="71%"  stop-color="#DEE3E6"/>
    <stop offset="88%"  stop-color="#8A9398"/>
    <stop offset="100%" stop-color="#C6CDD1"/>
  </linearGradient>
  <linearGradient id="chrome2" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%"   stop-color="#FBFCFC"/>
    <stop offset="30%"  stop-color="#B9C1C5"/>
    <stop offset="55%"  stop-color="#EDF1F3"/>
    <stop offset="80%"  stop-color="#8F989D"/>
    <stop offset="100%" stop-color="#D6DBDE"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.28"/>
    <stop offset="34%"  stop-color="#FFFFFF" stop-opacity="0.05"/>
    <stop offset="63%"  stop-color="#000000" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.44" r="0.74">
    <stop offset="54%"  stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.24"/>
  </radialGradient>

  <!-- tone-on-tone Art Nouveau ground -->
  <pattern id="tendril" width="186" height="186" patternUnits="userSpaceOnUse"
           patternTransform="rotate(-8)">
    <path d="M8 160 C 52 118, 40 62, 94 40 S 166 62, 178 18" fill="none"
          stroke="#E0B100" stroke-width="8" stroke-linecap="round"/>
    <path d="M-6 66 C 38 88, 72 52, 96 96 S 146 138, 190 106" fill="none"
          stroke="#E0B100" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M120 8 C 140 32, 132 52, 112 58" fill="none"
          stroke="#E0B100" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="150" cy="152" r="10" fill="none" stroke="#E0B100" stroke-width="5"/>
    <circle cx="36" cy="26" r="6" fill="none" stroke="#E0B100" stroke-width="4"/>
  </pattern>

  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"
                  stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n"/>
  </filter>

  <clipPath id="lid"><rect x="80" y="94" width="840" height="552" rx="66"/></clipPath>

  <!-- convex-up arc for the top line (sweep-flag = 1) -->
  <path id="arcTop" d="M334 262 A 900 900 0 0 1 882 262" fill="none"/>

  <!-- ——— illustration symbols ——— -->
  <g id="bayleaf">
    <path id="bl" d="M0 0 C 40 -36, 110 -32, 146 6 C 108 46, 38 42, 0 0 Z" fill="#4E8A3C"/>
    <path d="M18 2 C 52 -22, 104 -20, 128 4 C 96 24, 50 26, 18 2 Z" fill="#77B457"/>
    <use href="#bl" fill="none" stroke="#2A1E12" stroke-width="3.4"/>
    <path d="M6 2 C 52 -8, 104 -6, 140 6" fill="none" stroke="#2A1E12" stroke-width="2.4"/>
    <path d="M34 -14 l 6 14 M60 -20 l 4 18 M88 -19 l 0 18 M112 -13 l -4 15"
          fill="none" stroke="#2A1E12" stroke-width="1.6" opacity=".8"/>
  </g>

  <g id="chili">
    <path d="M2 -4 C -14 -24, -34 -30, -48 -22" fill="none"
          stroke="#2F6B34" stroke-width="10" stroke-linecap="round"/>
    <path d="M2 -4 C -14 -24, -34 -30, -48 -22" fill="none"
          stroke="#2A1E12" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <path id="ch" d="M0 0 C 44 12, 94 44, 118 96 C 128 122, 106 138, 88 124
                     C 54 98, 14 52, -6 16 Z" fill="#C22A20"/>
    <path d="M16 16 C 52 38, 88 76, 101 108" fill="none" stroke="#E2624F"
          stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <use href="#ch" fill="none" stroke="#2A1E12" stroke-width="3.4"/>
  </g>

  <!-- sardine, swimming left, nose at x=0 -->
  <g id="sardine">
    <path id="fish" d="M0 40
        C 34 12 92 -2 156 2 C 214 6 262 20 292 34
        L 340 4 L 322 40 L 340 76 L 292 47
        C 262 61 214 74 156 78 C 92 82 34 68 0 40 Z" fill="#C22A20"/>
    <path d="M30 42 C 74 22 140 16 200 22 C 258 28 292 40 292 40
             C 250 54 190 62 130 60 C 82 58 48 51 30 42 Z" fill="#E2624F"/>
    <path d="M148 2 C 176 -26 214 -30 236 -16 L 224 6 Z" fill="#C22A20"
          stroke="#2A1E12" stroke-width="3" stroke-linejoin="round"/>
    <path d="M118 70 C 132 92 158 100 176 92 L 160 70 Z" fill="#C22A20"
          stroke="#2A1E12" stroke-width="3" stroke-linejoin="round"/>
    <use href="#fish" fill="none" stroke="#2A1E12" stroke-width="3.8"
         stroke-linejoin="round"/>
    <path d="M44 16 C 58 34 58 48 46 66" fill="none" stroke="#2A1E12" stroke-width="2.6"/>
    <path d="M70 41 C 140 32 220 34 288 41" fill="none" stroke="#2A1E12"
          stroke-width="2" opacity=".75"/>
    <g stroke="#2A1E12" stroke-width="1.5" opacity=".7" fill="none">
      <path d="M108 24 q6 16 0 32 M140 20 q6 20 0 38 M172 19 q6 21 0 40
               M204 20 q6 20 0 38 M236 24 q5 17 0 32"/>
    </g>
    <circle cx="30" cy="36" r="8" fill="#FDF3D6" stroke="#2A1E12" stroke-width="2.4"/>
    <circle cx="31" cy="36" r="3.6" fill="#2A1E12"/>
  </g>

  <g id="pepperspray">
    <path d="M0 0 C 34 -12, 76 -16, 112 -10" fill="none"
          stroke="#2A1E12" stroke-width="2.6"/>
    <g fill="#D8A04A" stroke="#2A1E12" stroke-width="2">
      <circle cx="12" cy="4"   r="7"/><circle cx="30" cy="-2" r="7.5"/>
      <circle cx="47" cy="3"   r="7"/><circle cx="64" cy="-4" r="7.5"/>
      <circle cx="80" cy="2"   r="7"/><circle cx="96" cy="-6" r="6.5"/>
      <circle cx="21" cy="-11" r="6"/><circle cx="56" cy="-13" r="6"/>
      <circle cx="88" cy="-14" r="5.5"/>
    </g>
  </g>
</defs>

<!-- ————— tin body ————— -->
<rect x="50" y="64" width="900" height="612" rx="84" fill="url(#chrome)"/>
<rect x="66" y="80" width="868" height="580" rx="72" fill="none"
      stroke="#6E777C" stroke-width="3"/>
<rect x="74" y="88" width="852" height="564" rx="70" fill="none"
      stroke="#EFF3F5" stroke-width="2" opacity=".75"/>

<g clip-path="url(#lid)">
  <!-- field + ground pattern -->
  <rect x="80" y="94" width="840" height="552" fill="#F3CE0A"/>
  <rect x="80" y="94" width="840" height="552" fill="url(#tendril)" opacity=".45"/>

  <!-- border rules -->
  <rect x="112" y="126" width="776" height="488" rx="46" fill="none"
        stroke="#C22A20" stroke-width="9"/>
  <rect x="127" y="141" width="746" height="458" rx="34" fill="none"
        stroke="#2A1E12" stroke-width="2" opacity=".8"/>

  <!-- ——— botanicals: placed to cross the border rule, never the type ——— -->
  <use href="#bayleaf" transform="translate(806,300) rotate(-34) scale(1.12)"/>
  <use href="#bayleaf" transform="translate(788,372) rotate(16) scale(0.96)"/>
  <use href="#bayleaf" transform="translate(96,462) rotate(-16) scale(1.04)"/>
  <use href="#chili"   transform="translate(214,452) rotate(118) scale(0.92)"/>
  <use href="#chili"   transform="translate(190,548) rotate(104) scale(0.68)"/>
  <use href="#pepperspray" transform="translate(146,590) rotate(-9) scale(0.95)"/>
  <use href="#sardine" transform="translate(622,430) scale(0.84)"/>

  <g fill="#C22A20" stroke="#2A1E12" stroke-width="1.8">
    <path d="M0 -15 L4.4 -4.8 L15.2 -4.6 L6.6 2.1 L9.7 12.5 L0 6.4 L-9.7 12.5
             L-6.6 2.1 L-15.2 -4.6 L-4.4 -4.8 Z" transform="translate(163,300)"/>
    <path d="M0 -15 L4.4 -4.8 L15.2 -4.6 L6.6 2.1 L9.7 12.5 L0 6.4 L-9.7 12.5
             L-6.6 2.1 L-15.2 -4.6 L-4.4 -4.8 Z" transform="translate(163,344)"/>
    <path d="M0 -15 L4.4 -4.8 L15.2 -4.6 L6.6 2.1 L9.7 12.5 L0 6.4 L-9.7 12.5
             L-6.6 2.1 L-15.2 -4.6 L-4.4 -4.8 Z" transform="translate(163,388)"/>
  </g>

  <!-- ——— type ——— -->
  <text font-family="'Yeseva One', Georgia, serif" font-size="29"
        fill="#2A1E12" letter-spacing="0.4" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">Sardinas en aceite de oliva virgen,</textPath>
  </text>

  <g fill="#2A1E12">
    <text x="204" y="354" font-family="Almendra, Georgia, serif" font-size="56"
          font-style="italic" font-weight="700">con</text>
    <text font-family="'Yeseva One', Georgia, serif" font-size="98">
      <tspan x="308" y="376" rotate="-1.4 1 -0.5 1.7 -1.2 0.6 1.3 -1.7 0.8">pimientos</tspan>
    </text>
    <text x="236" y="478" font-family="Almendra, Georgia, serif" font-size="56"
          font-style="italic" font-weight="700">y</text>
    <text font-family="'Yeseva One', Georgia, serif" font-size="98">
      <tspan x="312" y="502" rotate="1.1 -1.5 0.7 1.4 -1 -1.6">laurel</tspan>
    </text>
  </g>

  <!-- brand block -->
  <g>
    <rect x="286" y="528" width="48" height="48" fill="none" stroke="#2A1E12"
          stroke-width="2.6"/>
    <path d="M322 540 a 15 15 0 1 0 0 24" fill="none" stroke="#2A1E12" stroke-width="3.6"/>
    <path d="M298 545 a 12 12 0 1 1 0 16" fill="none" stroke="#2A1E12" stroke-width="3.6"/>
    <text x="350" y="546" font-family="'Archivo Narrow', sans-serif" font-size="21"
          letter-spacing="3.5" fill="#2A1E12">CONSERVAS</text>
    <text x="348" y="588" font-family="'Baloo 2', system-ui, sans-serif" font-size="48"
          font-weight="700" fill="#2A1E12">cortés</text>
  </g>

  <!-- heritage ribbon -->
  <g transform="translate(722,548) rotate(-7)">
    <path d="M-122 -20 l -20 10 l 20 8 Z" fill="#8E1A13"/>
    <path d="M122 -20 l 20 10 l -20 8 Z" fill="#8E1A13"/>
    <path d="M-124 -23 H124 L106 0 L124 23 H-124 L-106 0 Z" fill="#C22A20"
          stroke="#2A1E12" stroke-width="3.2" stroke-linejoin="round"/>
    <text x="0" y="9" text-anchor="middle" font-family="'Archivo Narrow', sans-serif"
          font-size="26" font-weight="600" letter-spacing="3.5" fill="#F3CE0A"
          stroke="#2A1E12" stroke-width="0.9" paint-order="stroke fill">DESDE 1912</text>
  </g>

  <!-- weight, boxed origin, provenance -->
  <g font-family="'Archivo Narrow', sans-serif" fill="#2A1E12">
    <text x="286" y="620" font-size="19" letter-spacing="1.4">PESO NETO 120 g</text>
    <rect x="450" y="603" width="170" height="24" fill="none"
          stroke="#2A1E12" stroke-width="1.5"/>
    <text x="535" y="620" font-size="16" text-anchor="middle"
          letter-spacing=".6">producto de galicia</text>
  </g>
  <text x="866" y="620" text-anchor="end" font-family="'EB Garamond', Georgia, serif"
        font-style="italic" font-size="20" fill="#2A1E12" opacity=".92">
    pescadas en la Ría de Arousa
  </text>

  <!-- ——— ring pull, drawn over the artwork ——— -->
  <g transform="translate(204,208) scale(0.66)">
    <!-- contact shadow so the tab sits ON the lid -->
    <path fill="#000" opacity=".22"
          d="M-58 8 C -58 -22, -28 -40, 18 -40 C 72 -40, 110 -20, 110 8
             C 110 36, 72 56, 18 56 C -28 56, -58 38, -58 8 Z"/>
    <!-- faint score line of the opening panel -->
    <path d="M-78 -34 C -22 -56, 120 -48, 168 -18" fill="none" stroke="#8E979C"
          stroke-width="3" opacity=".5" stroke-linecap="round"/>
    <!-- tab with a punched hole -->
    <path fill-rule="evenodd" fill="url(#chrome2)" stroke="#4A5257" stroke-width="3.4"
          d="M-64 -2 C -64 -32, -34 -50, 12 -50 C 66 -50, 104 -30, 104 -2
             C 104 26, 66 46, 12 46 C -34 46, -64 28, -64 -2 Z
             M 34 -2 m -44 0 a 44 26 0 1 0 88 0 a 44 26 0 1 0 -88 0 Z"/>
    <path d="M-52 -14 C -46 -34, -18 -44, 8 -44" fill="none" stroke="#FBFDFD"
          stroke-width="4.5" opacity=".9" stroke-linecap="round"/>
    <circle cx="-34" cy="-2" r="15" fill="#C2CACE" stroke="#4A5257" stroke-width="2.8"/>
    <circle cx="-35" cy="-4" r="6.5" fill="#7F888D"/>
  </g>

  <!-- ——— finish ——— -->
  <rect x="80" y="94" width="840" height="552" filter="url(#grain)"
        opacity=".055" style="mix-blend-mode:multiply"/>
  <rect x="80" y="94" width="840" height="552" fill="url(#vig)"/>
  <rect x="80" y="94" width="840" height="552" rx="66" fill="url(#sheen)"/>
</g>
</svg>
<p class="cap">Archetype C — Art Nouveau hand-lettering. Worked example for the sardine-tin skill.</p>
</div>
</body>
</html>
