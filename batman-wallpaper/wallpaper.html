<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bat Ultrawide</title>
<style>
  html, body { margin: 0; padding: 0; background: #060708; }
  svg { display: block; }
</style>
</head>
<body>
<!-- Native canvas: 3840x1080 (32:9). Render at 4/3 scale for 5120x1440. -->
<svg id="wp" width="3840" height="1080" viewBox="0 0 3840 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%" gradientTransform="translate(0.5 0.46) scale(1 3.2) translate(-0.5 -0.46)">
      <stop offset="0" stop-color="#16181c"/>
      <stop offset="0.45" stop-color="#0d0e11"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>

    <!-- faint signal halo behind the emblem -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4cad1" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#c4cad1" stop-opacity="0.07"/>
      <stop offset="0.7" stop-color="#c4cad1" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#c4cad1" stop-opacity="0"/>
    </radialGradient>

    <!-- emblem body: matte graphite, a touch lighter at the top -->
    <linearGradient id="emblem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0c0c"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- hairline that fades toward the screen edges -->
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3ad" stop-opacity="0"/>
      <stop offset="1" stop-color="#9aa3ad" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="ruleR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3ad" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9aa3ad" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="50%" gradientTransform="translate(0.5 0.5) scale(1 3.556) translate(-0.5 -0.5)">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- film grain: kills gradient banding on dark panels -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>

    <filter id="softShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.65"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="3840" height="1080" fill="url(#bg)"/>

  <!-- fine dot grid, barely there -->
  <g id="grid" fill="#ffffff" fill-opacity="0.035"></g>

  <ellipse cx="1920" cy="520" rx="1100" ry="470" fill="url(#halo)"/>

  <!-- horizon rule + ticks -->
  <g id="rule"></g>

  <!-- emblem (path built below, mirrored from one half) -->
  <g transform="translate(1920 520)">
    <g filter="url(#softShadow)">
      <path id="bat" fill="url(#emblem)"/>
    </g>
    <path id="batEdge" fill="none" stroke="url(#edge)" stroke-width="2"/>
  </g>

  <!-- quiet labels -->
  <g font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="6" fill="#8b939c" fill-opacity="0.38">
    <text x="300" y="506">GCPD // SIGNAL</text>
    <text x="3540" y="506" text-anchor="end">GOTHAM — 32:9</text>
  </g>

  <rect width="3840" height="1080" fill="url(#vignette)"/>
</svg>

<script>
  // Right half of the bat, center-origin, y down. Mirrored for the left half.
  // Each segment: [cmd, ...points]; first entry is the start point.
  const S = 1.15; // emblem scale
  const half = [
    ['M', 0, -36],
    ['L', 22, -36],
    ['L', 40, -122],            // ear tip
    ['L', 66, -44],             // ear base
    ['Q', 100, -34, 156, -58],  // shoulder
    ['C', 270, -104, 400, -138, 530, -160], // leading edge to wing tip
    ['C', 494, -104, 466, -48, 456, 20],    // outer trailing edge
    ['Q', 406, -16, 340, 38],   // scallop 1
    ['Q', 288, 8, 226, 76],     // scallop 2
    ['C', 160, 50, 66, 80, 0, 206],         // lower body to tail point
  ];

  function pathFrom(half) {
    const f = v => (v * S).toFixed(2);
    const pt = (x, y) => `${f(x)},${f(y)}`;
    let d = '';
    for (const [c, ...p] of half) {
      d += c;
      for (let i = 0; i < p.length; i += 2) d += pt(p[i], p[i + 1]) + ' ';
    }
    // mirror back: reverse segments, swapping endpoints/controls
    const pts = half.map(([c, ...p]) => ({ c, p }));
    for (let i = pts.length - 1; i > 0; i--) {
      const { c, p } = pts[i];
      const prev = pts[i - 1].p.slice(-2);
      const m = (x, y) => pt(-x, y);
      if (c === 'L') d += 'L' + m(...prev) + ' ';
      if (c === 'Q') d += 'Q' + m(p[0], p[1]) + ' ' + m(...prev) + ' ';
      if (c === 'C') d += 'C' + m(p[2], p[3]) + ' ' + m(p[0], p[1]) + ' ' + m(...prev) + ' ';
    }
    return d + 'Z';
  }
  const d = pathFrom(half);
  document.getElementById('bat').setAttribute('d', d);
  document.getElementById('batEdge').setAttribute('d', d);

  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };

  // dot grid
  const grid = document.getElementById('grid');
  for (let x = 60; x < 3840; x += 60)
    for (let y = 60; y < 1080; y += 60)
      el('circle', { cx: x, cy: y, r: 1.1 }, grid);

  // horizon rule with ticks, broken around the emblem
  const rule = document.getElementById('rule');
  const y = 520, gap = 700, x0 = 280, x1 = 3560;
  el('rect', { x: x0, y: y, width: 1920 - gap - x0, height: 1.5, fill: 'url(#ruleL)' }, rule);
  el('rect', { x: 1920 + gap, y: y, width: x1 - 1920 - gap, height: 1.5, fill: 'url(#ruleR)' }, rule);
  for (let i = 0; ; i++) {
    const dx = gap + i * 40;
    if (1920 + dx > x1) break;
    const major = i % 5 === 0;
    const t = (dx - gap) / (x1 - 1920 - gap);
    const op = (0.28 * (1 - t)).toFixed(3);
    for (const x of [1920 - dx, 1920 + dx])
      el('rect', { x: x - 0.75, y: y + 6, width: 1.5, height: major ? 14 : 6, fill: '#9aa3ad', 'fill-opacity': op }, rule);
  }
</script>
</body>
</html>
