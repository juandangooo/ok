<meta charset="utf-8">
<title>Load-In Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#e9ecef; --panel:#f8f9fa; --ink:#15191e; --muted:#5b6570; --line:#cfd5db;
  --tape:#f4efe1; --tape-ink:#23201a;
  --accent:#e8a317; --accent-ink:#1b1400;
  --good:#1f9d55; --bad:#d64541;
  --audio:#2f6fd6; --lighting:#d99a00; --video:#7b4fd6; --other:#6b7580;
  --shadow:0 2px 0 rgba(20,25,30,.18);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#121518; --panel:#1b1f24; --ink:#e8ecef; --muted:#98a2ad; --line:#2c333b;
  --tape:#e9e2cc; --tape-ink:#1e1b14; --shadow:0 2px 0 rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#121518; --panel:#1b1f24; --ink:#e8ecef; --muted:#98a2ad; --line:#2c333b;
  --tape:#e9e2cc; --tape-ink:#1e1b14; --shadow:0 2px 0 rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-inline:16px;padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 12px}
.brand{font:800 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand .tape{background:var(--tape);color:var(--tape-ink);padding:4px 10px 3px;transform:rotate(-1.5deg);box-shadow:var(--shadow)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{font-weight:500;color:var(--accent)}
nav{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 12px;font:700 17px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{font:800 26px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-block:12px 22px}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;box-shadow:var(--shadow);display:grid;gap:6px;color:var(--ink)}
.mode:hover{border-color:var(--accent)}
.mode .t{font:800 22px/1 var(--display);text-transform:uppercase}
.mode .d{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px var(--body);cursor:pointer;display:flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.dept{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.dept .row{display:flex;justify-content:space-between;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%}
/* game */
.game{display:grid;gap:14px}
.gtop{display:flex;align-items:center;gap:12px}
.gtop .progress{flex:1;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.gtop .progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.hearts{font:500 16px var(--mono);color:var(--bad);letter-spacing:2px}
.quit{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:4px 10px;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.prompt{font:700 22px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.photo{background:#fff;border-radius:8px;display:grid;place-items:center;height:230px;padding:10px}
.photo img{max-height:210px;max-width:100%;object-fit:contain}
.photo.sm{height:150px}.photo.sm img{max-height:130px}
.tag{display:inline-block;font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:4px;color:#fff}
.name-tape{background:var(--tape);color:var(--tape-ink);font:700 20px/1.2 var(--display);padding:6px 12px;justify-self:start;transform:rotate(-.6deg);box-shadow:var(--shadow)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:12px 14px;font:500 16px var(--body);cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt kbd{font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.price{font:500 20px var(--mono);font-variant-numeric:tabular-nums}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.opt:disabled{cursor:default}
.feedback{border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.feedback.ok{background:color-mix(in srgb,var(--good) 16%,var(--panel));border:1px solid var(--good)}
.feedback.no{background:color-mix(in srgb,var(--bad) 14%,var(--panel));border:1px solid var(--bad)}
.feedback .h{font:800 20px var(--display);text-transform:uppercase}
.feedback .facts{font-size:14px;color:var(--muted)}
.next{justify-self:end;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 26px;font:800 18px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.gtop .progress span{transition:none}}
.result{text-align:center;display:grid;gap:10px;justify-items:center}
.big{font:800 64px/1 var(--display);color:var(--accent)}
.miss{display:grid;gap:8px;width:100%;text-align:left}
.miss div{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.miss img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:4px}
/* browse */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:16px var(--body)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;cursor:pointer;text-align:left;color:var(--ink);align-content:start}
.item .photo{height:120px;padding:6px}.item .photo img{max-height:108px}
.item .nm{font:600 14px/1.25 var(--body)}
.item .pr{font:500 13px var(--mono);color:var(--muted)}
.item .more{font-size:13px;color:var(--muted)}
.foot{color:var(--muted);font-size:13px;margin-top:22px}

/* kahoot-style quiz */
.kq{display:grid;gap:10px}
.kqh{display:flex;justify-content:space-between;align-items:center}
.kpts{font:500 14px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.ktimer{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.ktimer span{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.ktiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.ktiles.k8{grid-template-columns:1fr}.ktiles:not(.k8){grid-template-columns:1fr}}
.ktile{display:grid;grid-template-columns:auto 56px 1fr;gap:10px;align-items:center;text-align:left;border:0;border-radius:10px;padding:10px;cursor:pointer;
  background:var(--k);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--k) 60%,#000);min-height:84px}
.ktile:hover:not(:disabled){filter:brightness(1.08)}
.ktile .ksh{font-size:22px;width:24px;text-align:center}
.ktile img,.ktile .kimg{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:6px}
.ktx{display:grid;gap:2px}.ktx b{font:700 15px/1.2 var(--body)}.ktx small{font-size:12px;opacity:.9;line-height:1.3}
.kwhy{font-style:normal;font-size:13px;background:rgba(0,0,0,.25);border-radius:6px;padding:4px 6px;margin-top:4px}
.ktile.kright{outline:4px solid #fff;box-shadow:0 0 0 7px var(--good)}
.ktile.kwrong{opacity:.9;outline:4px solid #fff;box-shadow:0 0 0 7px var(--bad)}
.ktile.kdim{opacity:.55}
@media (prefers-reduced-motion:reduce){.ktimer span{transition:none}}

/* gigs */
.gigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.gig{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;color:var(--ink);display:grid;gap:4px;box-shadow:var(--shadow)}
.gig:hover{border-color:var(--accent)}
.gig .v{font:800 19px/1.1 var(--display);text-transform:uppercase}
.gig .m{font-size:13px;color:var(--muted)}
.gig .best{font:500 12px var(--mono);color:var(--accent)}
.brief{display:grid;gap:8px}
.brief .req{font:600 18px/1.35 var(--body)}
.brief dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.brief dt{font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.brief dd{margin:0}
.twist{background:color-mix(in srgb,var(--accent) 18%,var(--panel));border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:14px}
.pull{display:grid;gap:6px;margin-top:8px}
.prow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.prow.on{border-color:var(--accent)}
.prow img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:4px}
.prow .nm{font:600 14px/1.25 var(--body)}
.prow .sub{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 18px var(--body);cursor:pointer}
.qty button:disabled{opacity:.35;cursor:default}
.eopt{align-items:center}.eopt img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:6px;flex:none}.eopt .none{width:56px;text-align:center;color:var(--muted);flex:none}
.need{margin:0;padding-left:18px;display:grid;gap:2px;font-size:14px}
.cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.cats .chip{white-space:nowrap}.cats .chip b{font:500 12px var(--mono);color:var(--accent)}
.truck{position:sticky;bottom:0;margin-top:12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.truck .t{font:700 16px var(--display);letter-spacing:.06em;text-transform:uppercase}
.truck .s{font:500 12px var(--mono);opacity:.8}
.truck button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font:800 16px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.truck .ghost{background:none;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.checks{display:grid;gap:6px;text-align:left;width:100%}
.check{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.check .i{font:800 18px var(--display)}
.check.ok .i{color:var(--good)}.check.no .i{color:var(--bad)}
.check b{font:700 15px var(--body)}.check span{font-size:14px;color:var(--muted)}

.sheet{position:fixed;inset:0;background:rgba(10,12,15,.55);display:grid;place-items:center;padding:16px;z-index:10}
.sheet .card{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto}
.sheet .close{justify-self:end;background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:4px 12px;cursor:pointer;font:600 14px var(--body)}
.facts-list{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0}
.facts-list dt{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.facts-list dd{margin:0}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.links{grid-template-columns:1fr}}
.lnk{display:grid;gap:2px;text-decoration:none;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:10px 12px}
.lnk:hover{border-color:var(--accent)}
.lnk b{font:800 17px var(--display);letter-spacing:.06em;text-transform:uppercase}
.lnk span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.lnk.search b::after{content:" (search)";font-weight:600;color:var(--muted)}
.loading{padding:40px 0;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div class="brand"><span class="tape">Load-In</span> Drills</div>
    <div class="stats">
      <span class="stat">XP <b id="xp">0</b></span>
      <span class="stat">Streak <b id="streak">0</b>d</span>
      <span class="stat">Mastered <b id="mastered">0</b>/<span id="total">0</span></span>
    </div>
  </header>
  <nav role="tablist">
    <button role="tab" data-tab="play" aria-selected="true">Play</button>
    <button role="tab" data-tab="gigs" aria-selected="false">Gigs</button>
    <button role="tab" data-tab="browse" aria-selected="false">Browse the shop</button>
  </nav>
  <main id="view"><p class="loading">Loading the inventory…</p></main>
  <p class="foot">757 products from the Current RMS export. Packages, cases and billing lines are left out. Prices are new retail from real listings; items without a confirmed price only show up in the photo and job drills.</p>
</div>

<script>
/* Gig mode: venues, gear categories and answer keys.
   Grading is by category (any sub is a sub, any vocal mic is a vocal mic).
   Every rule below is a game assumption drafted from NJ_Rock_Venue_Game_Scenarios.xlsx; edit freely. */
window.GIG_DATA = (() => {
  // ---- categories: every shop item is sorted into one by its type and name ----
  const CATS = [
    ["console","Mixing consoles"],["snake","Snakes & stage boxes"],["vocal","Vocal mics"],["instmic","Instrument & drum mics"],
    ["speech","Lectern, lav & headset mics"],["wireless","Wireless mic systems"],["di","DI boxes"],
    ["speaker","Speakers (mains or wedges)"],["sub","Subwoofers"],["linearray","Line arrays & column PA"],
    ["iem","In-ear monitors"],["stand","Mic & speaker stands"],["fixture","Lighting fixtures"],["lightctl","Lighting control"],
    ["dmx","DMX cables"],["switcher","Video switchers"],["camera","Cameras"],["playback","Video playback"],["sdi","SDI cables"],
    ["display","Screens & projectors"],["intercom","Intercom"],["cable","Audio & power cables"],["power","Power & distro"],["other","Everything else"],
  ];
  function cat(x){
    const t=x.t.toLowerCase(), n=x.n.toLowerCase();
    if(/lighting console|usb-dmx interface|dmx lighting controller/.test(t+" "+n)) return "lightctl";
    if(/video switcher|live production switcher|streaming video mixer/.test(t+" "+n)) return "switcher";
    if(/mixer|mixing console/.test(t) && !/video/.test(t)) return "console";
    if(/snake|stage box|breakout|multicore|press box/.test(t+" "+n) && !/dmx|power|soca/.test(t+" "+n)) return "snake";
    if(/wireless handheld|wireless receiver|wireless transmitter|antenna/.test(t)) return "wireless";
    if(/in-ear|iem/.test(t)) return "iem";
    if(/podium|cart\b/.test(n)) return "other";
    if(/lectern mic|lavalier|earset|headset mic/.test(t) || /pcc/.test(n)) return "speech";
    if(/vocal mic/.test(t)) return "vocal";
    if(/instrument mic|drum mic|condenser mic|dynamic mic|boundary|drum mic kit/.test(t)) return "instmic";
    if(/\bdi box|direct box/.test(t)) return "di";
    if(/subwoofer/.test(t)) return "sub";
    if(/line array speaker|column/.test(t) || /evox/.test(n)) return "linearray";
    if(/powered speaker/.test(t)) return "speaker";
    if(/mic stand|speaker stand|speaker pole/.test(t)) return "stand";
    if(/\bpar\b|moving head|strobe|pixel bar|uplight|ellipsoidal|followspot|wash|lighting kit/.test(t)) return "fixture";
    if(/dmx cable|combo cable/.test(t)) return "dmx";
    if(/ptz camera|camera$/.test(t)) return "camera";
    if(/recorder|player/.test(t)) return "playback";
    if(/sdi/.test(t)) return "sdi";
    if(/^tv$|projector|display/.test(t)) return "display";
    if(/intercom/.test(t)) return "intercom";
    if(/cable|cord/.test(t)) return "cable";
    if(/power|generator|cam-lok|distro/.test(t)) return "power";
    return "other";
  }
  // ---- specs the grader needs for some categories ----
  const CONSOLES = { // channels, monitor mixes, digital, stage-box family
    "p02-24":{ch:48,mix:12,dig:true,fam:"ah"}, "p19-35":{ch:64,mix:16,dig:true,fam:"yam"},
    "p11-05":{ch:40,mix:16,dig:true,fam:"mt"}, "p11-06":{ch:40,mix:16,dig:true,fam:"mt",needsBox:true},
    "p07-22":{ch:40,mix:16,dig:true,fam:"mt",needsBox:true}, "p03-11":{ch:40,mix:16,dig:true,fam:"mt"},
    "p03-12":{ch:40,mix:16,dig:true,fam:"mt"}, "p03-13":{ch:40,mix:16,dig:true,fam:"mt"}, "p03-14":{ch:40,mix:16,dig:true,fam:"mt"},
    "p19-29":{ch:16,mix:8,dig:true,fam:"yam"}, "p19-34":{ch:16,mix:4,dig:false}, "p19-33":{ch:12,mix:2,dig:false},
    "p03-15":{ch:12,mix:2,dig:false}, "p19-32":{ch:10,mix:1,dig:false}, "p19-31":{ch:6,mix:1,dig:false}, "p10-19":{ch:4,mix:0,dig:false},
  };
  const BOX_FAM = {"p02-23":"ah","p11-04":"mt","p03-10":"mt"}; // digital boxes only talk to their own brand
  const boxCh = x => { const m=x.n.match(/(\d+)\s*[x×]\s*\d+/i) || x.n.match(/DL(\d+)|S(\d+) |DX(\d)(\d)/i);
    if(/DX168/i.test(x.n)) return 16; if(/DL32/i.test(x.n)) return 32; if(/S16/i.test(x.n)) return 16; if(/CAT Box 8/i.test(x.n)) return 8;
    if(/CAT Tails/i.test(x.n)) return 4; if(/Press Box/i.test(x.n)) return 0; return m ? +m[1] : 8; };
  const inputsOf = x => { const k=cat(x);
    if(k==="vocal"||k==="instmic"||k==="speech") return /kit/i.test(x.t)?7:1;
    if(k==="di") return /stereo|prod2|direct2|proav2|usb-p|jdi stereo/i.test(x.n)?2:1;
    if(k==="wireless" && /receiver/i.test(x.t)) return /4Q|EM 4/i.test(x.n)?4:/4D\b|Dual/i.test(x.n)?2:1;
    return 0; };
  const WL_FAM = n => (n.match(/ULXD|QLXD|SLXD|EW-DX|EW 100 G3|G4/i)||[""])[0].toUpperCase();

  // ---- the 15 venues ----
  // need: [category, how many, label]. "mics" = vocal + instrument mics combined; "vocalish" = anything a singer can use.
  const H = "The house has a main PA.", HL = "The house PA covers the low end.";
  const GIGS = [
    {id:1,venue:"Lizzie Rose Music Room",town:"Tuckerton",cap:"70 seated",house:"Stage and building power. Bring a compact PA.",
     request:"Roots-rock trio: acoustic guitar, upright bass, mandolin, three vocals. Low volume, small stage.",
     pa:"bring",inputs:6,mixes:2,digital:false,box:false,
     need:[["vocalish",3,"Vocal mics for 3 singers"],["di",2,"DIs for acoustic and bass"],["stand",3,"Mic stands"]],
     forbid:[["sub","Subs are overkill for a 70-seat acoustic trio."],["linearray","A line array in a 70-seat room is way too much."]],
     bigConsoleWarn:true},

    if(need(g,"camera")) Q.push({title:"Camera",q:"The client wants a live camera feed. What do you pull?",pool:()=>videoPool().map(x=>{const ok=cat(x)==="camera";return {x,ok,why:ok?"A PTZ camera, driven remotely from FOH.":videoWhy(x)}})});
    if(need(g,"sdi")) Q.push({title:"Video cables",q:`${need(g,"sdi")} long video runs. Which cable?`,pool:()=>cablePool().map(x=>{const ok=cat(x)==="sdi";return {x,ok,why:ok?"SDI over BNC runs long distances with a locking connector.":cableWhy(x)}})});
    if(g.intercom) Q.push({title:"Crew intercom",q:`${g.intercom} crew need headsets. What do you pull?`,pool:()=>[
      bundle({"p08-22":1,"p08-21":g.intercom},`C1 Pro base station + ${g.intercom} C1 Pro headsets`,true,"One system: base station plus its headsets."),
      bundle({"p08-25":1,"p08-26":g.intercom},`SE Pro 9S base station + ${g.intercom} SE Pro headsets`,true,"One system: base station plus its headsets."),
      bundle({"p08-21":g.intercom},`${g.intercom} C1 Pro headsets, no base`,false,"Headsets without a base station can't talk to each other."),
      bundle({"p08-25":1,"p08-21":g.intercom},`SE Pro 9S base + ${g.intercom} C1 Pro headsets`,false,"Mixed systems. An SE Pro base won't pair with C1 Pro headsets."),
      bundle({"p08-19":1},"C1 battery charging case",false,"A charger, not an intercom."),
      bundle({"p08-16":g.intercom},`${g.intercom} C1 Pro batteries`,false,"Batteries, not headsets.")]});
    return Q;
  }
  const diWhy=x=>/in-ear/i.test(x.t)?"A P2 is an in-ear monitor pack, not a DI.":/headphone/i.test(x.t)?"A headphone amp, not a DI.":/ground/i.test(x.t)?"A ground lifter kills hum on a line that's already balanced. It doesn't convert an instrument.":"A press box splits one feed to reporters.";
  // ---- MEDIUM: only the categories this gig touches, plus a checklist ----
  function mediumCats(g){
    const s=new Set(["console","vocal","instmic","cable","speaker","iem","linearray","display"]);
    if(g.box) s.add("snake"); if(g.pa==="bring"||need(g,"sub")) s.add("sub");
    const map={vocalish:"vocal",mics:"instmic",stereoDI:"di"};
    g.need.forEach(([k])=>s.add(map[k]||k)); if(g.wireless) s.add("wireless"); if(g.intercom) s.add("intercom");
    g.forbid.forEach(([k])=>s.add(k)); if(s.has("fixture")) s.add("lightctl");
    return CATS.map(c=>c[0]).filter(k=>s.has(k));
  }
  function checklist(g){
    const L=[`Console with ${Math.max(g.inputs,g.minCh||0)}+ channels and ${g.mixes} monitor mixes${g.digital?" (digital)":""}`,`${g.inputs} inputs total`,`${g.mixes} monitor mixes`];
    if(g.pa==="bring") L.push("2 speakers for the mains"); if(g.box) L.push("A snake or stage box for every input");
    g.need.forEach(([,n,l])=>L.push(`${l}: ${n}`)); if(g.wireless) L.push("Wireless handheld + matching receiver");
    if(g.iem) L.push(`${g.iem} separate in-ear mixes`); if(g.intercom) L.push(`Intercom base + ${g.intercom} headsets`);
    return L;
  }

  // ---- grading ----
  function grade(gig, pick, byId){
    const items=Object.entries(pick).filter(([,n])=>n>0).map(([id,n])=>({x:byId[id],n}));
    const inCat=k=>items.filter(i=>cat(i.x)===k);
    const count=k=>inCat(k).reduce((s,i)=>s+i.n,0);
    const checks=[]; const add=(ok,label,detail)=>checks.push({ok,label,detail});
    const wl=inCat("wireless"), hh=wl.filter(i=>/handheld/i.test(i.x.t)), rx=wl.filter(i=>/receiver/i.test(i.x.t));
    const counts={
      vocalish: count("vocal") + inCat("instmic").filter(i=>/dynamic/i.test(i.x.t)).reduce((s,i)=>s+i.n,0) + hh.reduce((s,i)=>s+i.n,0),
      mics: [...inCat("vocal"),...inCat("instmic")].reduce((s,i)=>s+i.n*inputsOf(i.x),0) + hh.reduce((s,i)=>s+i.n,0),
      stereoDI: inCat("di").filter(i=>inputsOf(i.x)===2).reduce((s,i)=>s+i.n,0),
      di: inCat("di").reduce((s,i)=>s+i.n*inputsOf(i.x),0),
    };
    const have=k=>k in counts?counts[k]:count(k);
    // console
    const cons=inCat("console"), nCons=count("console");
    const C=cons.length?(CONSOLES[cons[0].x.id]||{ch:16,mix:2,dig:/digital/i.test(cons[0].x.t)}):null;
    const cname=cons.length?cons[0].x.n:"";
    const totalIn=items.reduce((s,i)=>s+i.n*inputsOf(i.x),0);
    if(!nCons) add(false,"Mixing console","No mixing console on the truck.");
    else if(nCons>1) add(false,"Mixing console",`${nCons} consoles on the truck. Send one.`);
    else {
      const need=Math.max(gig.inputs,gig.minCh||0), p=[];
      if(gig.digital && !C.dig) p.push("this gig needs a digital console so scenes can be saved");
      if(C.ch<need) p.push(`it has ${C.ch} channels and the show needs ${need}`);
      if(C.mix<gig.mixes) p.push(`it has ${C.mix} monitor mixes and the band needs ${gig.mixes}`);
      add(!p.length,"Mixing console",p.length?`${cname}: ${p.join("; ")}.`:`${cname}: ${C.ch} channels, ${C.mix} monitor mixes. Good fit.`);
      if(gig.bigConsoleWarn && C.ch>=40) add(false,"Right-sized console",`A ${C.ch}-channel console for a 70-seat trio is overkill. Any small mixer does this job.`);
    }
    add(totalIn>=gig.inputs,"Enough inputs",`${totalIn} inputs on the truck (mics, DIs, wireless channels). The show needs ${gig.inputs}.`);
    if(C && totalIn>C.ch) add(false,"Inputs fit the console",`${totalIn} inputs won't fit on a ${C.ch}-channel console.`);
    // monitors
    const wedges=Math.max(0,count("speaker")-(gig.pa==="bring"?2:0));
    const iem=inCat("iem"), p2=iem.filter(i=>/amp/i.test(i.x.t)).reduce((s,i)=>s+i.n,0);
    const tx=iem.filter(i=>/transmitter/i.test(i.x.t)).reduce((s,i)=>s+i.n,0), bp=iem.filter(i=>/receiver|bodypack/i.test(i.x.t)).reduce((s,i)=>s+i.n,0);
    const wIem=Math.min(tx,bp), dest=wedges+p2+wIem;
    add(dest>=gig.mixes,"Monitor mixes",`${dest} monitor destinations (${wedges} wedge${wedges===1?"":"s"}, ${p2} wired in-ear, ${wIem} wireless in-ear). The band needs ${gig.mixes}.`);
    if(gig.pa==="bring") add(count("speaker")>=2,"Main PA",count("speaker")>=2?`${count("speaker")} speakers: 2 as mains, the rest as wedges.`:"Bring at least 2 speakers for the mains, plus any wedges.");
    // snake / stage box
    if(gig.box || (C&&C.needsBox)){
      let cap=0, wrong=false;
      for(const i of inCat("snake")){ const f=BOX_FAM[i.x.id]; if(f && C && f!==C.fam) wrong=true; else cap+=boxCh(i.x)*i.n; }
      add(cap>=totalIn && cap>0 && !wrong,"Snake / stage box", wrong?"That digital stage box only talks to its own brand of console (A&H DX168 with the SQ-7; Midas DL32 or Behringer S16 with an M32 or X32). An analog snake works with anything.":
        cap?`${cap} stage channels for ${totalIn} inputs.${cap<totalIn?" Not enough.":""}`:"Nothing gets the stage inputs to FOH. Bring a snake or stage box.");
    }
    for(const [k,min,label] of gig.need){ const h=have(k); add(h>=min,label,`${h} on the truck, need ${min}.`); }
    if(gig.wireless){
      const fams=new Set(rx.map(i=>WL_FAM(i.x.n)));
      const ok=hh.some(i=>fams.has(WL_FAM(i.x.n)));
      add(ok,"Guest vocal wireless", ok?"Handheld and receiver are the same system.":hh.length?"The handheld needs a receiver from the same system (ULX-D with ULXD4, QLX-D with QLXD4, SLX-D with SLXD4).":"No wireless handheld for the guest.");
    }
    if(gig.iem) add(p2+wIem>=gig.iem,"In-ear mixes",`${p2+wIem} separate in-ear mixes (${p2} wired packs, ${wIem} wireless transmitter + bodypack pairs). Needs ${gig.iem}. A bodypack without its own transmitter isn't a mix.`);
    if(gig.intercom){
      const ic=inCat("intercom"), fam=n=>/C1/i.test(n)?"C1":/9S|SE Pro/i.test(n)?"SE":"";
      const bases=ic.filter(i=>/master|package/i.test(i.x.n)), packs=ic.filter(i=>/headset|remote/i.test(i.x.n)&&!/master/i.test(i.x.n));
      const ok=bases.some(b=>packs.filter(p=>fam(p.x.n)===fam(b.x.n)).reduce((s,p)=>s+p.n,0)+(/package/i.test(b.x.n)?5:0)>=gig.intercom);
      add(ok,"Crew intercom",ok?"Base station plus enough headsets from the same system.":`Needs a base station and ${gig.intercom} headsets from the same Hollyland system.`);
    }
    const names={sub:"subwoofer",linearray:"line array / column PA",fixture:"lighting fixture"};
    for(const [k,why] of gig.forbid){ const n=count(k); if(n) add(false,"Leave it at the shop",`${n} × ${names[k]||k}: ${why}`); }
    return {checks,passed:checks.filter(c=>c.ok).length,total:checks.length};
  }
  return {GIGS,grade,cat,CATS,questions,setShop,mediumCats,checklist};
})();

</script>
<script>
(() => {
const CAT = {Audio:"var(--audio)",Lighting:"var(--lighting)",Video:"var(--video)",Other:"var(--other)"};
const CAT_NAME = {Audio:"Audio",Lighting:"Lighting",Video:"Video",Other:"Staging & rigging"};
const store = {
  get(k,d){try{const v=localStorage.getItem("lid_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("lid_"+k,JSON.stringify(v))}catch(e){}}
};
let GEAR=[], byId={};
let st = store.get("state",{xp:0,streak:0,last:"",box:{}});
let dept = store.get("dept","All");
const view = document.getElementById("view");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = p => p==null?"Price not confirmed":"$"+(p>=100?Math.round(p).toLocaleString():p.toFixed(2));
const shuffle = a => {for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const today = () => new Date().toISOString().slice(0,10);
const box = id => st.box[id]||0;
function save(){store.set("state",st);renderStats()}
function renderStats(){
  document.getElementById("xp").textContent=st.xp.toLocaleString();
  document.getElementById("streak").textContent=st.streak;
  document.getElementById("mastered").textContent=GEAR.filter(g=>box(g.id)>=3).length;
  document.getElementById("total").textContent=GEAR.length;
}
function pool(){return GEAR.filter(g=>dept==="All"||g.c===dept)}

const MODES = {
  photo:{t:"Name that gear",d:"See the photo, pick the right name.",ok:g=>g.img&&!g.sub},
  price:{t:"Price is right",d:"Guess what it costs new.",ok:g=>g.p!=null&&g.img&&!g.sub},
  job:{t:"What's it for?",d:"Match the gear to its job on a show.",ok:g=>g.w&&g.w.length>12},
};

/* ---------- home ---------- */
function home(){
  const chips=["All","Audio","Lighting","Video","Other"].map(c=>`<button class="chip" data-dept="${c}" aria-pressed="${dept===c}">${c!=="All"?`<i style="background:${CAT[c]}"></i>`:""}${c==="All"?"All departments":CAT_NAME[c]}</button>`).join("");
  const depts=["Audio","Lighting","Video","Other"].map(c=>{
    const all=GEAR.filter(g=>g.c===c), m=all.filter(g=>box(g.id)>=3).length, pct=all.length?Math.round(m/all.length*100):0;
    return `<div class="dept"><div class="row"><span class="label" style="color:${CAT[c]}">${CAT_NAME[c]}</span><span>${m}/${all.length}</span></div><div class="bar"><span style="width:${pct}%;background:${CAT[c]}"></span></div></div>`}).join("");
  view.innerHTML=`
    <div class="label">Department</div>
    <div class="chips" style="margin-top:8px">${chips}</div>
    <div class="modes">${Object.entries(MODES).map(([k,m])=>`<button class="mode" data-mode="${k}"><span class="t">${m.t}</span><span class="d">${m.d}</span><span class="label">${pool().filter(m.ok).length} items · 10 questions · 3 lives</span></button>`).join("")}
      <button class="mode" data-mode="mix"><span class="t">Full shift</span><span class="d">All three drills mixed together. Double XP.</span><span class="label">15 questions · 3 lives</span></button>
    </div>
    <div class="label">Mastery by department</div>
    <div class="dept-grid">${depts}</div>
    <p class="foot">An item counts as mastered after you get it right 3 times in a row. Items you miss come back sooner.</p>`;
  view.querySelectorAll("[data-dept]").forEach(b=>b.onclick=()=>{dept=b.dataset.dept;store.set("dept",dept);home()});
  view.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>startRound(b.dataset.mode));
}

/* ---------- round ---------- */
let R=null;
function pick(n, modes){
  // weight toward items with low mastery
  const out=[], used=new Set();
  let tries=0;
  while(out.length<n && tries<5000){
    tries++;
    const mode=modes[Math.random()*modes.length|0];
    const cands=pool().filter(g=>MODES[mode].ok(g)&&!used.has(g.id));
    if(!cands.length) continue;
    const w=cands.map(g=>1/(1+box(g.id)*2)); const sum=w.reduce((a,b)=>a+b,0);
    let r=Math.random()*sum, i=0; while(r>w[i]){r-=w[i];i++}
    used.add(cands[i].id); out.push({mode,g:cands[i]});
  }
  return out;
}
function startRound(mode){
  const modes = mode==="mix"?["photo","price","job"]:[mode];
  const qs=pick(mode==="mix"?15:10, modes);
  if(qs.length<4){view.innerHTML=`<p>Not enough items in this department for that drill yet.</p>`;return}
  R={mode,qs,i:0,lives:3,combo:0,earned:0,correct:0,missed:[],mult:mode==="mix"?2:1};
  ask();
}
function distractors(g, mode){
  const base=GEAR.filter(x=>x.id!==g.id && x.c===g.c);
  let c;
  if(mode==="photo") c=base.filter(x=>x.t!==g.t && x.n.split(" ").slice(0,2).join(" ")!==g.n.split(" ").slice(0,2).join(" "));
  if(mode==="job") c=base.filter(x=>x.w && x.w!==g.w && x.t!==g.t);
  if(!c||c.length<3) c=GEAR.filter(x=>x.id!==g.id && x.t!==g.t);
  return shuffle(c).slice(0,3);
}
function priceOpts(p){
  const priced=shuffle(GEAR.filter(x=>x.p!=null).map(x=>x.p));
  const out=[p];
  for(const v of priced){ if(out.every(o=>Math.max(o,v)/Math.min(o,v)>=1.6)) out.push(v); if(out.length===4) break; }
  return shuffle(out);
}
function ask(){
  const q=R.qs[R.i], g=q.g;
  let prompt, media="", opts;
  if(q.mode==="photo"){
    prompt="What is this?";
    media=`<div class="photo"><img alt="Mystery gear" src="${g.img}"></div>`;
    opts=shuffle([g,...distractors(g,"photo")]).map(x=>({label:x.n,right:x.id===g.id}));
  } else if(q.mode==="price"){
    prompt="What does one cost new?";
    media=`<div class="photo sm"><img alt="" src="${g.img}"></div><div class="name-tape">${esc(g.n)}</div>`;
    opts=priceOpts(g.p).map(v=>({label:money(v),right:v===g.p,price:true}));
  } else {
    prompt="What does this do?";
    media=`${g.img&&!g.sub?`<div class="photo sm"><img alt="" src="${g.img}"></div>`:""}<div class="name-tape">${esc(g.n)}</div>`;
    opts=shuffle([g,...distractors(g,"job")]).map(x=>({label:x.w,right:x.id===g.id}));
  }
  R.opts=opts;
  const total=R.qs.length;
  view.innerHTML=`<div class="game">
    <div class="gtop"><button class="quit" id="quit">Quit</button><div class="progress"><span style="width:${R.i/total*100}%"></span></div><span class="hearts" aria-label="${R.lives} lives">${"♥".repeat(R.lives)}${"♡".repeat(3-R.lives)}</span></div>
    <div class="card pop">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="tag" style="background:${CAT[g.c]}">${CAT_NAME[g.c]}</span><span class="label">${R.i+1} / ${total}${R.combo>=3?` · combo ×${R.combo}`:""}</span></div>
      <div class="prompt">${prompt}</div>
      ${media}
      <div class="opts">${opts.map((o,k)=>`<button class="opt${o.price?" price":""}" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o.label)}</span></button>`).join("")}</div>
      <div id="fb"></div>
    </div></div>`;
  document.getElementById("quit").onclick=home;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  if(R.answered) return; R.answered=true;
  const q=R.qs[R.i], g=q.g, ok=R.opts[k].right;
  view.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true; if(R.opts[j].right) b.classList.add("right"); else if(j===k) b.classList.add("wrong")});
  if(ok){
    R.combo++; R.correct++;
    const pts=(10+Math.min(R.combo-1,5)*2)*R.mult; R.earned+=pts;
    st.box[g.id]=box(g.id)+1;
  } else {
    R.combo=0; R.lives--; st.box[g.id]=0; R.missed.push(g);
  }
  const facts=[g.t, g.s, g.p!=null?money(g.p)+" each":"", g.q!=null?`${g.q} in the shop`:""].filter(Boolean).map(esc).join(" · ");
  const cheers=["Nailed it","Clean","Good ears","Pro move","Tight"];
  document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"ok":"no"} pop">
    <div class="h">${ok?cheers[Math.random()*cheers.length|0]+` +${(10+Math.min(R.combo-1,5)*2)*R.mult} XP`:"Not quite"}</div>
    <div><b>${esc(g.n)}</b>. ${esc(g.w)}</div><div class="facts">${facts}</div></div>
    <button class="next" id="next">${R.lives===0||R.i+1===R.qs.length?"See results":"Continue"}</button>`;
  save();
  const nx=document.getElementById("next"); nx.focus({preventScroll:true});
  nx.onclick=()=>{R.answered=false; R.i++; if(R.lives===0||R.i>=R.qs.length) finish(); else ask();};
}
function finish(){
  const t=today();
  if(st.last!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10); st.streak=st.last===y?st.streak+1:1; st.last=t;}
  const perfect=R.lives===3&&R.i>=R.qs.length;
  if(perfect){R.earned+=25*R.mult}
  st.xp+=R.earned; save();
  const out=R.lives===0;
  view.innerHTML=`<div class="card result pop">
    <div class="label">${out?"Out of lives":"Round complete"}</div>
    <div class="big">+${R.earned} XP</div>
    <h2>${R.correct} of ${R.i} right${perfect?" · perfect round, +"+25*R.mult+" bonus":""}</h2>
    ${R.missed.length?`<div class="label" style="margin-top:6px">Study these</div><div class="miss">${R.missed.map(g=>`<div>${g.img&&!g.sub?`<img alt="" src="${g.img}">`:""}<span><b>${esc(g.n)}</b><br><span style="color:var(--muted);font-size:14px">${esc(g.w)} ${g.p!=null?"· "+money(g.p):""}</span></span></div>`).join("")}</div>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="next" id="again">Play again</button><button class="chip" id="menu">Back to drills</button></div>
  </div>`;
  document.getElementById("again").onclick=()=>startRound(R.mode);
  document.getElementById("menu").onclick=home;
}
document.addEventListener("keydown",e=>{
  if(!R||!document.querySelector(".opt")) return;
  if(!R.answered && /^[1-4]$/.test(e.key)) answer(+e.key-1);
  else if(R.answered && (e.key==="Enter"||e.key===" ")){const n=document.getElementById("next"); if(n){e.preventDefault(); n.click();}}
});

/* ---------- browse ---------- */
function browse(){
  view.innerHTML=`<div class="tools"><input id="q" type="search" placeholder="Search 716 items (try “SM58” or “truss”)" aria-label="Search gear">
    <div class="chips">${["All","Audio","Lighting","Video","Other"].map(c=>`<button class="chip" data-dept="${c}" aria-pressed="${dept===c}">${c==="All"?"All":CAT_NAME[c]}</button>`).join("")}</div></div>
    <div class="label" id="count"></div><div class="grid" id="grid" style="margin-top:8px"></div>`;
  const q=document.getElementById("q");
  const draw=()=>{
    const s=q.value.trim().toLowerCase();
    const list=pool().filter(g=>!s||(g.n+" "+g.t+" "+g.w).toLowerCase().includes(s)).sort((a,b)=>(b.p??-1)-(a.p??-1));
    document.getElementById("count").textContent=`${list.length} items · most expensive first`;
    document.getElementById("grid").innerHTML=list.slice(0,300).map(g=>`<button class="item" data-id="${g.id}">
      <div class="photo">${g.img?`<img loading="lazy" alt="" src="${g.img}">`:""}</div>
      <span class="tag" style="background:${CAT[g.c]};justify-self:start">${CAT_NAME[g.c]}</span>
      <span class="nm">${esc(g.n)}</span><span class="pr">${g.p!=null?money(g.p):"—"}${g.q!=null?` · ×${g.q}`:""}</span></button>`).join("");
    document.querySelectorAll(".item").forEach(b=>b.onclick=()=>detail(byId[b.dataset.id],b));
  };
  q.oninput=draw;
  view.querySelectorAll("[data-dept]").forEach(b=>b.onclick=()=>{dept=b.dataset.dept;store.set("dept",dept);view.querySelectorAll("[data-dept]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.dept===dept));draw()});
  draw();
}


/* ---------- gigs ---------- */
const GD=window.GIG_DATA;
let G=null;
let diff=store.get("gigdiff","easy");
const DIFF={easy:["Easy","Quiz: one decision at a time, 4 choices of the same kind of gear. 30 seconds each."],
  medium:["Medium","Quiz: 8 choices per question, several right, and 20 seconds each."],
  hard:["Hard","The whole shop and no checklist. Just you and the client's request."]};
function gigList(){
  const best=store.get("gigbest",{});
  view.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap">
      <div><h2>Pull the show</h2><div class="foot" style="margin-top:4px">You're the shop lead. Read the gig, pull gear from the real inventory, load the truck.</div></div>
      <button class="next" id="rand">Random gig</button></div>
    <div class="label" style="margin-top:14px">Difficulty</div>
    <div class="chips" style="margin-top:6px">${Object.entries(DIFF).map(([k,[l]])=>`<button class="chip" data-diff="${k}" aria-pressed="${diff===k}">${l}</button>`).join("")}</div>
    <div class="foot" style="margin-top:6px">${DIFF[diff][1]}</div>
    <div class="gigs">${GD.GIGS.map(g=>`<button class="gig" data-g="${g.id}"><span class="label">${esc(g.town)} · ${esc(g.cap)}</span><span class="v">${esc(g.venue)}</span><span class="m">${esc(g.request)}</span>${best[diff+g.id]!=null?`<span class="best">Best on ${DIFF[diff][0]}: ${best[diff+g.id]}%</span>`:""}</button>`).join("")}</div>`;
  document.getElementById("rand").onclick=()=>startGig(GD.GIGS[Math.random()*GD.GIGS.length|0].id);
  view.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>startGig(+b.dataset.g));
  view.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{diff=b.dataset.diff;store.set("gigdiff",diff);gigList()});
}
function startGig(id){
  const gig=GD.GIGS.find(g=>g.id===id);
  clearInterval(G&&G.tm); G={gig,pick:{},q:"",dept:"console",diff,cats:null};
  if(diff==="hard") gigScreen(); else quizStart();
}
const KCOL=[["#e21b3c","▲"],["#1368ce","◆"],["#d89e00","●"],["#26890c","■"]];
function quizStart(){
  G.qs=GD.questions(G.gig); G.i=0; G.right=0; G.pts=0; G.streak=0; G.log=[]; G.state={}; quizAsk();
}
function sample(pool,level){
  const good=shuffle(pool.filter(o=>o.ok)), bad=shuffle(pool.filter(o=>!o.ok));
  const nGood=level==="easy"?1:Math.min(2,good.length), nTot=level==="easy"?4:8;
  const seen=new Set(), wrong=[];
  for(const o of bad){const t=o.x?o.x.t:o.name; if(!seen.has(t)){seen.add(t);wrong.push(o);} if(wrong.length>=nTot-nGood)break;}
  for(const o of bad){if(wrong.length>=nTot-nGood)break; if(!wrong.includes(o))wrong.push(o);}
  return shuffle([...good.slice(0,nGood),...wrong]);
}
function optName(o){ if(o.x) return o.x.n; return o.name; }
function optImg(o){ const x=o.x||byId[Object.keys(o.bundle)[0]]; return x&&x.img&&!x.sub?x.img:""; }
function optDesc(o){ if(o.x){const w=(o.x.w||"").replace(/Skip this one.*$/,"").trim(); return `${o.x.t}${w?" · "+w:""}`;} return Object.entries(o.bundle).map(([id,n])=>`${n} × ${byId[id].n}`).join(" + "); }
function quizAsk(){
  window.scrollTo(0,0);
  const g=G.gig, q=G.qs[G.i]; let pool=q.pool(G.state);
  const opts=sample(pool,G.diff); if(!opts.some(o=>o.ok)){G.i++; return G.i<G.qs.length?quizAsk():quizResult();}
  const T=G.diff==="easy"?30:20;
  view.innerHTML=`<div class="game"><div class="gtop"><button class="quit" id="gback">All gigs</button><div class="progress"><span style="width:${G.i/G.qs.length*100}%"></span></div><span class="label">${G.i+1}/${G.qs.length}</span></div>
    ${G.i===0?gigBrief(g):`<div class="label">${esc(g.venue)} · ${esc(g.request)}</div>`}
    <div class="kq pop"><div class="kqh"><span class="label">${esc(q.title)}</span><span class="kpts">${G.pts.toLocaleString()} pts${G.streak>=2?` · 🔥${G.streak}`:""}</span></div>
      <div class="prompt">${esc(q.q)}</div>
      <div class="ktimer"><span id="kt"></span></div>
      <div class="ktiles ${opts.length>4?"k8":""}">${opts.map((o,j)=>{const [c,sh]=KCOL[j%4];const im=optImg(o);return `<button class="ktile" data-j="${j}" style="--k:${c}">
        <span class="ksh">${sh}</span>${im?`<img alt="" src="${im}">`:`<span class="kimg"></span>`}
        <span class="ktx"><b>${esc(optName(o))}</b><small>${esc(optDesc(o))}</small><em class="kwhy" hidden></em></span></button>`}).join("")}</div>
      <div id="fb"></div></div></div>`;
  document.getElementById("gback").onclick=()=>{clearInterval(G.tm);gigList()};
  const t0=Date.now(), bar=document.getElementById("kt"); let done=false;
  G.tm=setInterval(()=>{const left=Math.max(0,T-(Date.now()-t0)/1000); bar.style.width=(left/T*100)+"%"; if(left<=0) pick(-1);},100);
  const pick=j=>{ if(done)return; done=true; clearInterval(G.tm);
    const left=Math.max(0,T-(Date.now()-t0)/1000), o=j>=0?opts[j]:null, ok=!!(o&&o.ok);
    if(ok){G.right++;G.streak++;const p=Math.round(500+500*left/T)+Math.min(G.streak-1,5)*100;G.pts+=p;G.last=p;} else {G.streak=0;G.last=0;}
    if(q.key==="console"&&o&&o.x) G.state.console=o.x.id;
    G.log.push({t:q.title,ok,pick:o?optName(o):"Time ran out",why:o?o.why:"",good:opts.filter(x=>x.ok).map(optName).join(" or "),goodWhy:opts.find(x=>x.ok).why});
    view.querySelectorAll(".ktile").forEach((b,k)=>{b.disabled=true;const oo=opts[k];b.classList.add(oo.ok?"kright":k===j?"kwrong":"kdim");
      const w=b.querySelector(".kwhy");w.textContent=(oo.ok?"✓ ":"✗ ")+oo.why;w.hidden=false;});
    document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"ok":"no"} pop"><div class="h">${ok?`Right call +${G.last}`:j<0?"Time's up":"Not that"}</div>
      ${ok?"":`<div>Right answer: <b>${esc(opts.filter(x=>x.ok).map(optName).join(" or "))}</b>. ${esc(opts.find(x=>x.ok).why)}</div>`}</div>
      <button class="next" id="enext">${G.i+1<G.qs.length?"Next":"Load the truck"}</button>`;
    const n=document.getElementById("enext"); n.focus({preventScroll:true});
    n.onclick=()=>{G.i++; G.i<G.qs.length?quizAsk():quizResult();};
  };
  view.querySelectorAll(".ktile").forEach(b=>b.onclick=()=>pick(+b.dataset.j));
}
function quizResult(){
  window.scrollTo(0,0);
  const g=G.gig, n=G.log.length, pct=Math.round(G.right/n*100), xp=G.right*(G.diff==="easy"?10:15)+(pct===100?30:0);
  st.xp+=xp; const best=store.get("gigbest",{}); const k=G.diff+g.id; best[k]=Math.max(best[k]||0,pct); store.set("gigbest",best); save();
  view.innerHTML=`<div class="card result pop"><div class="label">${esc(g.venue)} · ${DIFF[G.diff][0]}</div><div class="big">${G.pts.toLocaleString()}</div><div class="label">points</div>
    <h2>${pct===100?"Show went off clean":pct>=70?"Show happened, with a few scrambles":"Truck's coming back to the shop"}</h2>
    <div class="label">+${xp} XP · ${G.right} of ${n} right</div>
    <div class="checks">${G.log.map(c=>`<div class="check ${c.ok?"ok":"no"}"><span class="i">${c.ok?"✓":"✗"}</span><div><b>${esc(c.t)}</b><br><span>${c.ok?esc(c.pick):`You picked ${esc(c.pick)}. Right: ${esc(c.good)}.`}</span></div></div>`).join("")}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="next" id="again">Play again</button>${G.diff!=="hard"?`<button class="chip" id="up">Try it on ${G.diff==="easy"?"Medium":"Hard"}</button>`:""}<button class="chip" id="all">All gigs</button></div></div>`;
  document.getElementById("again").onclick=()=>startGig(g.id);
  const up=document.getElementById("up"); if(up) up.onclick=()=>{diff=G.diff==="easy"?"medium":"hard";store.set("gigdiff",diff);startGig(g.id)};
  document.getElementById("all").onclick=gigList;
}
function gigBrief(g){
  return `<div class="card brief"><div class="label">Gig #${g.id} · ${esc(g.town)}, NJ</div><h2>${esc(g.venue)}</h2>
    <div class="req">“${esc(g.request)}”</div>
    <dl><dt>Room</dt><dd>${esc(g.cap)}</dd><dt>House has</dt><dd>${esc(g.house)}</dd>${g.note?`<dt>Note</dt><dd>${esc(g.note)}</dd>`:""}</dl>
    ${g.twist?`<div class="twist"><b>Change from the client:</b> ${esc(g.twist)}</div>`:""}
    ${false?`<div class="label" style="margin-top:4px">The show needs</div><ul class="need">${GD.checklist(g).map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:""}</div>`;
}
function gigScreen(){
  window.scrollTo(0,0);
  const g=G.gig;
  view.innerHTML=`<div class="game"><div class="gtop"><button class="quit" id="gback">All gigs</button><span class="label" style="flex:1">Pull sheet · ${G.diff==="medium"?"Medium":"Hard"}</span></div>
    ${gigBrief(g)}
    <div class="tools" style="margin:0"><input id="gq" type="search" placeholder="Search the whole shop (try “SM58”, “snake”, “sub”)" aria-label="Search the shop" value="${esc(G.q)}"></div>
    <div class="label">Shop by category</div>
    <div class="chips cats" id="gcats"></div>
    <div class="pull" id="plist"></div>
    <div class="truck"><div><div class="t" id="tt"></div><div class="s" id="ts"></div></div>
      <div style="display:flex;gap:8px"><button class="ghost" id="clear">Clear</button><button id="load">Load the truck</button></div></div></div>`;
  document.getElementById("gback").onclick=gigList;
  const q=document.getElementById("gq"); q.oninput=()=>{G.q=q.value;drawPull()};
  document.getElementById("clear").onclick=()=>{G.pick={};drawPull()};
  document.getElementById("load").onclick=gigResult;
  drawPull();
}
function drawPull(){
  const s=G.q.trim().toLowerCase();
  const onTruck=k=>Object.entries(G.pick).filter(([id])=>GD.cat(byId[id])===k).reduce((a,[,n])=>a+n,0);
  const chips=[["pulled","On the truck"],...GD.CATS.filter(([k])=>!G.cats||G.cats.includes(k))];
  document.getElementById("gcats").innerHTML=chips.map(([k,l])=>{const n=k==="pulled"?Object.values(G.pick).reduce((a,b)=>a+b,0):onTruck(k);
    return `<button class="chip" data-gc="${k}" aria-pressed="${G.dept===k}">${esc(l)}${n?` <b>${n}</b>`:""}</button>`}).join("");
  document.querySelectorAll("[data-gc]").forEach(b=>b.onclick=()=>{G.dept=b.dataset.gc;G.q="";document.getElementById("gq").value="";const x=document.getElementById("gcats").scrollLeft;drawPull();document.getElementById("gcats").scrollLeft=x});
  let list=GEAR.filter(x=>x.q>0&&(!G.cats||G.cats.includes(GD.cat(x))));
  if(s) list=list.filter(x=>(x.n+" "+x.t+" "+x.r).toLowerCase().includes(s));
  else if(G.dept==="pulled") list=list.filter(x=>G.pick[x.id]);
  else list=list.filter(x=>GD.cat(x)===G.dept);
  const catName=Object.fromEntries(GD.CATS);
  const el=document.getElementById("plist");
  el.innerHTML=list.length?list.slice(0,120).map(x=>{const n=G.pick[x.id]||0;return `<div class="prow${n?" on":""}" data-id="${x.id}">
      ${x.img&&!x.sub?`<img alt="" src="${x.img}" loading="lazy">`:`<span></span>`}
      <div><div class="nm">${esc(x.n)}</div><div class="sub">${esc(catName[GD.cat(x)])} · ${esc(x.t)} · shop has ${x.q}</div></div>
      <div class="qty"><button data-d="-1" ${n?"":"disabled"} aria-label="Remove one">−</button><span>${n}</span><button data-d="1" ${n>=x.q?"disabled":""} aria-label="Add one">+</button></div></div>`}).join("")
    :`<p class="foot">${G.dept==="pulled"&&!s?"Nothing on the truck yet. Pick a category above.":"No matches. Try another word."}</p>`;
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const id=b.closest(".prow").dataset.id, x=byId[id];
    G.pick[id]=Math.max(0,Math.min(x.q,(G.pick[id]||0)+ +b.dataset.d)); if(!G.pick[id]) delete G.pick[id];
    const sx=document.getElementById("gcats").scrollLeft; drawPull(); document.getElementById("gcats").scrollLeft=sx;});
  const items=Object.values(G.pick).reduce((a,b)=>a+b,0);
  document.getElementById("tt").textContent=`Truck: ${items} item${items===1?"":"s"}`;
  const top=GD.CATS.map(([k,l])=>[l,onTruck(k)]).filter(([,n])=>n).map(([l,n])=>`${l}: ${n}`);
  document.getElementById("ts").textContent=top.length?top.slice(0,4).join(" · ")+(top.length>4?" …":""):"Count your channels and monitor mixes before you load.";
}
function gigResult(){
  window.scrollTo(0,0);
  const g=G.gig, r=GD.grade(g,G.pick,byId), pct=Math.round(r.passed/r.total*100);
  const xp=r.passed*15+(pct===100?50:0);
  st.xp+=xp; const best=store.get("gigbest",{}); best[G.diff+g.id]=Math.max(best[G.diff+g.id]||0,pct); store.set("gigbest",best); save();
  const verdict=pct===100?"Show went off clean":pct>=75?"Show happened, with a few scrambles":pct>=50?"Rough night at FOH":"Truck's coming back to the shop";
  view.innerHTML=`<div class="card result pop"><div class="label">${esc(g.venue)}</div><div class="big">${pct}%</div><h2>${verdict}</h2>
    <div class="label">+${xp} XP · ${r.passed} of ${r.total} checks passed</div>
    <div class="checks">${r.checks.map(c=>`<div class="check ${c.ok?"ok":"no"}"><span class="i">${c.ok?"✓":"✗"}</span><div><b>${esc(c.label)}</b><br><span>${esc(c.detail)}</span></div></div>`).join("")}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="next" id="fix">Fix the pull</button><button class="chip" id="another">Another gig</button><button class="chip" id="all">All gigs</button></div></div>`;
  document.getElementById("fix").onclick=gigScreen;
  document.getElementById("another").onclick=()=>{let n;do{n=GD.GIGS[Math.random()*GD.GIGS.length|0].id}while(n===g.id);startGig(n)};
  document.getElementById("all").onclick=gigList;
}

const host = u => {try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return ""}};
const gsearch = q => "https://www.google.com/search?q="+encodeURIComponent(q);
function detail(g, from){
  const model = g.r || g.n;
  const site = g.u ? {href:g.u, sub:host(g.u), search:false} : {href:gsearch(model), sub:"No saved link yet", search:true};
  const man = g.m ? {href:g.m, sub:host(g.m), search:false} : {href:gsearch(model+" manual pdf"), sub:"No saved link yet", search:true};
  const el=document.createElement("div"); el.className="sheet";
  el.innerHTML=`<div class="card pop" role="dialog" aria-modal="true" aria-label="${esc(g.n)}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="tag" style="background:${CAT[g.c]}">${CAT_NAME[g.c]}</span><button class="close" id="close">Close</button></div>
    ${g.img?`<div class="photo"><img alt="" src="${g.img}"></div>`:""}
    <h2>${esc(g.n)}</h2>
    <dl class="facts-list">
      ${g.w?`<dt>Job</dt><dd>${esc(g.w)}</dd>`:""}
      ${g.t?`<dt>Type</dt><dd>${esc(g.t)}</dd>`:""}
      ${g.s?`<dt>Specs</dt><dd>${esc(g.s)}</dd>`:""}
      ${g.r?`<dt>Model</dt><dd>${esc(g.r)}</dd>`:""}
      <dt>Price</dt><dd style="font-family:var(--mono)">${money(g.p)}</dd>
      ${g.q!=null?`<dt>In shop</dt><dd>${g.q}${g.sub?" (sub-rental)":""}</dd>`:""}
    </dl>
    <div class="links">
      <a class="lnk${site.search?" search":""}" href="${esc(site.href)}" target="_blank" rel="noopener"><b>Website</b><span>${esc(site.sub)}</span></a>
      <a class="lnk${man.search?" search":""}" href="${esc(man.href)}" target="_blank" rel="noopener"><b>Manual</b><span>${esc(man.sub)}</span></a>
    </div></div>`;
  const close=()=>{el.remove();document.removeEventListener("keydown",onKey);from&&from.focus()};
  const onKey=e=>{if(e.key==="Escape")close()};
  el.onclick=e=>{if(e.target===el)close()};
  document.addEventListener("keydown",onKey);
  document.body.appendChild(el);
  el.querySelector("#close").onclick=close; el.querySelector("#close").focus();
}

document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav [data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));
  R=null; clearInterval(G&&G.tm); ({play:home,gigs:gigList,browse:browse})[b.dataset.tab]();
});

fetch("gear.json").then(r=>r.json()).then(d=>{GEAR=d;d.forEach(g=>byId[g.id]=g);GD.setShop(d);renderStats();home()})
  .catch(()=>{view.innerHTML=`<p>The gear list didn't load. Reload the page to try again.</p>`});
})();
</script>
