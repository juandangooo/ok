<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Portal Loop</title>
<style>html,body{margin:0;background:#050506}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="3840" height="1080"></canvas>
<script>
const W = 3840, H = 1080, CX = 1920, CY = 540;
const LOOP = 32; // seconds, seamless
const WARM = '226,196,160';   // portal light
const EMBER = '196,120,96';   // the heat-lightning swell, a muted nod to Hellhound red
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const sine = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
const TAU = Math.PI * 2;
// periodic drift so everything returns to where it started
const osc = (t, periods, phase = 0) => Math.sin(TAU * periods * t / LOOP + phase);

// ---------- timeline ----------
const BAT = { in: [2, 8.5], out: [12, 17.5] };
const HOUND = { in: [18, 24.5], out: [27, 31.8] };
// heat lightning: [time, strength]; soft swells, never lines
const SWELLS = [[6.2, 0.45], [17.6, 1.0], [18.5, 0.55], [28.4, 0.35]];

function presence(t, tl) {
  if (t <= tl.in[0] || t >= tl.out[1]) return 0;
  if (t < tl.in[1]) return sine((t - tl.in[0]) / (tl.in[1] - tl.in[0]));
  if (t < tl.out[0]) return 1;
  return 1 - sine((t - tl.out[0]) / (tl.out[1] - tl.out[0]));
}
function swell(t) {
  let s = 0;
  for (const [t0, k] of SWELLS) {
    const d = t - t0;
    if (d < -0.6 || d > 3.2) continue;
    // slow rise, two gentle breaths, long tail
    const env = d < 0 ? smooth((d + 0.6) / 0.6) : Math.exp(-d * 1.15);
    const breath = 0.75 + 0.25 * Math.cos(d * 5.2);
    s = Math.max(s, k * env * breath);
  }
  return s;
}
// vertical position of the swell travelling down the seam (0 top .. 1 bottom)
function swellY(t) {
  let best = null, bk = 0;
  for (const [t0, k] of SWELLS) { const d = t - t0; if (d > -0.6 && d < 3.2 && k > bk) { bk = k; best = d; } }
  return best === null ? 0.5 : clamp(0.15 + (best + 0.6) / 3.2 * 0.75);
}

// ---------- assets ----------
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
let houndImg, houndEdge, fogA, fogB, neonRed, neonWhite, fogDark, fogRed;

// ---------- static layers ----------
const off = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const bg = off();
(() => {
  const b = bg.getContext('2d');
  b.fillStyle = '#060709'; b.fillRect(0, 0, W, H);
  b.save(); b.translate(CX, CY); b.scale(1, 0.3);
  let g = b.createRadialGradient(0, 0, 0, 0, 0, 2300);
  g.addColorStop(0, '#15161a'); g.addColorStop(0.35, '#0d0e11'); g.addColorStop(1, 'rgba(6,7,9,0)');
  b.fillStyle = g; b.fillRect(-CX, -CY * 4, W, H * 8); b.restore();
  // faint warm spill hugging the floor of the frame
  g = b.createLinearGradient(0, H * 0.55, 0, H);
  g.addColorStop(0, 'rgba(40,30,24,0)'); g.addColorStop(1, 'rgba(40,30,24,0.18)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
})();
const vig = off();
(() => {
  const v = vig.getContext('2d');
  v.save(); v.translate(CX, CY); v.scale(1, 0.3);
  const g = v.createRadialGradient(0, 0, 0, 0, 0, CX * 1.02);
  g.addColorStop(0.4, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)');
  v.fillStyle = g; v.fillRect(-CX, -CY * 4, W, H * 8); v.restore();
})();

// ---------- bat ----------
const half = [
  ['M', 0, -36], ['L', 22, -36], ['L', 40, -122], ['L', 66, -44],
  ['Q', 100, -34, 156, -58], ['C', 270, -104, 400, -138, 530, -160],
  ['C', 494, -104, 466, -48, 456, 20], ['Q', 406, -16, 340, 38],
  ['Q', 288, 8, 226, 76], ['C', 160, 50, 66, 80, 0, 206],
];
function batPath(S) {
  const pt = (x, y) => `${(x * S).toFixed(2)},${(y * S).toFixed(2)} `;
  let d = '';
  for (const [c, ...p] of half) { d += c; for (let i = 0; i < p.length; i += 2) d += pt(p[i], p[i + 1]); }
  for (let i = half.length - 1; i > 0; i--) {
    const [c, ...p] = half[i]; const prev = half[i - 1].slice(-2);
    const m = (x, y) => pt(-x, y);
    if (c === 'L') d += 'L' + m(...prev);
    if (c === 'Q') d += 'Q' + m(p[0], p[1]) + m(...prev);
    if (c === 'C') d += 'C' + m(p[2], p[3]) + m(p[0], p[1]) + m(...prev);
  }
  return new Path2D(d + 'Z');
}
const BAT_S = 0.86, bat = batPath(BAT_S);
const BAT_REST = CX - 700, BAT_FROM = CX - 230;
const HOUND_H = 640, HOUND_W = HOUND_H * 1400 / 1630;
const HOUND_REST = CX + 600, HOUND_FROM = CX + 220;

// one shared scratch canvas per side for masking/lighting
const scratch = off(), sx = scratch.getContext('2d');

// light the emblem from the portal side and feather it into the seam
function finishEmblem(side, p, light) {
  sx.globalCompositeOperation = 'source-atop';
  const lg = sx.createLinearGradient(CX, 0, CX - side * 1100, 0);
  lg.addColorStop(0, `rgba(${WARM},${0.16 * light})`);
  lg.addColorStop(0.5, `rgba(${WARM},${0.04 * light})`);
  lg.addColorStop(1, `rgba(${WARM},0)`);
  sx.fillStyle = lg; sx.fillRect(0, 0, W, H);
  sx.globalCompositeOperation = 'destination-in';
  const m = sx.createLinearGradient(CX - side * 30, 0, CX - side * 300, 0);
  m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(1, 'rgba(0,0,0,1)');
  sx.fillStyle = m; sx.fillRect(0, 0, W, H);
  sx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.globalAlpha = p;
  ctx.filter = `blur(${((1 - p) * 8).toFixed(2)}px)`;
  ctx.drawImage(scratch, 0, 0);
  ctx.restore();
}

function backHalo(x, y, rx, ry, a) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(${WARM},${0.11 * a})`);
  g.addColorStop(0.5, `rgba(${WARM},${0.04 * a})`);
  g.addColorStop(1, `rgba(${WARM},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 7); ctx.fill(); ctx.restore();
}

function drawBat(t, light) {
  const p = presence(t, BAT); if (p <= 0) return;
  const x = BAT_FROM + (BAT_REST - BAT_FROM) * p + osc(t, 2) * 5;
  const y = CY - 30 + osc(t, 3, 1) * 4;
  backHalo(x, y + 10, 900, 400, p * 1.35);
  sx.clearRect(0, 0, W, H);
  sx.save(); sx.translate(x, y);
  sx.shadowColor = 'rgba(0,0,0,0.7)'; sx.shadowBlur = 50; sx.shadowOffsetY = 18;
  sx.fillStyle = '#0b0b0c'; sx.fill(bat);
  sx.shadowColor = 'transparent';
  const g = sx.createLinearGradient(0, -150, 0, 190);
  g.addColorStop(0, 'rgba(255,240,222,0.28)'); g.addColorStop(0.5, 'rgba(255,240,222,0.04)'); g.addColorStop(1, 'rgba(255,240,222,0)');
  sx.strokeStyle = g; sx.lineWidth = 1.6; sx.stroke(bat);
  sx.restore();
  finishEmblem(1, p, light);
}

function drawHound(t, light) {
  const p = presence(t, HOUND); if (p <= 0) return;
  const x = HOUND_FROM + (HOUND_REST - HOUND_FROM) * p + osc(t, 2, 2) * 5;
  const y = CY + 10 + osc(t, 3, 2.5) * 4;
  backHalo(x, y - 70, 700, 420, p);
  sx.clearRect(0, 0, W, H);
  const x0 = x - HOUND_W / 2, y0 = y - HOUND_H / 2;
  sx.save();
  sx.shadowColor = 'rgba(0,0,0,0.7)'; sx.shadowBlur = 50; sx.shadowOffsetY = 18;
  sx.drawImage(houndImg, x0, y0, HOUND_W, HOUND_H);
  sx.restore();
  sx.save(); sx.globalAlpha = 0.16; sx.drawImage(houndEdge, x0, y0, HOUND_W, HOUND_H); sx.restore();
  const n = neon(t);
  drawNeon(x0, y0, n);
  finishEmblem(-1, p, light);
  neonWeather(t, x, y - 60, n, p);
}

// ---------- neon ----------
const NEON_ON = 21.6;
function neon(t) {
  const p = presence(t, HOUND);
  if (p <= 0) return 0;
  const d = t - NEON_ON;
  if (d < 0) return 0;
  // two soft stutters, then a slow warm-up; nothing snaps
  const bump = (t0, len) => { const x = d - t0; return x > 0 && x < len ? Math.sin(Math.PI * x / len) : 0; };
  const v = Math.max(0.35 * bump(0, 0.35), 0.55 * bump(0.55, 0.4), smooth((d - 1.1) / 0.9));
  const hum = 0.93 + 0.04 * Math.sin(t * 7.3) + 0.03 * Math.sin(t * 17.1 + 1.2);
  return clamp(v * hum) * Math.min(1, p * 1.15);
}

function drawNeon(x0, y0, n) {
  if (n <= 0.002) return;
  sx.save();
  sx.globalCompositeOperation = 'lighter';
  const layer = (img, blur, a) => {
    sx.filter = blur ? `blur(${blur}px)` : 'none';
    sx.globalAlpha = a;
    sx.drawImage(img, x0, y0, HOUND_W, HOUND_H);
  };
  // wide bloom, mid glow, then the tube itself kept dim: it lives under the haze
  layer(neonRed, 120, 0.9 * n); layer(neonRed, 46, 0.9 * n); layer(neonRed, 14, 0.7 * n); layer(neonRed, 0, 0.45 * n);
  layer(neonWhite, 90, 0.35 * n); layer(neonWhite, 40, 0.55 * n); layer(neonWhite, 10, 0.55 * n); layer(neonWhite, 0, 0.5 * n);
  sx.restore();
}

// drifting dark fog and red-lit fog around the emblem: neon seen through weather
function neonWeather(t, x, y, n, p) {
  if (p <= 0) return;
  const mask = (c, rx, ry, a) => {
    c.globalCompositeOperation = 'destination-in';
    c.save(); c.translate(x, y); c.scale(1, ry / rx);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.6, `rgba(0,0,0,${a * 0.6})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(-rx * 2, -rx * 2, rx * 4, rx * 4); c.restore();
    c.globalCompositeOperation = 'source-over';
  };
  // red spill lighting the haze
  if (n > 0.002) {
    hx.clearRect(0, 0, W, H);
    hx.drawImage(fogRed, -500 + osc(t, 1, 0.4) * 300, -80 + osc(t, 1, 1.7) * 50, 5200, 1250);
    mask(hx, 900, 560, 1);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.28 * n;
    ctx.drawImage(hazeC, 0, 0); ctx.restore();
    // soft red ambient behind everything nearby
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.translate(x, y); ctx.scale(1, 0.75);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 760);
    g.addColorStop(0, `rgba(200,40,36,${0.07 * n})`); g.addColorStop(1, 'rgba(200,40,36,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 760, 0, 7); ctx.fill(); ctx.restore();
  }
  // shadow: dark wisps passing in front of the tubes
  hx.clearRect(0, 0, W, H);
  hx.drawImage(fogDark, -800 + osc(t, 2, 1.1) * 380, -60 + osc(t, 1, 0.3) * 70, 5400, 1200);
  hx.globalAlpha = 0.8;
  hx.drawImage(fogDark, -300 + osc(t, 1, 2.6) * 300, -120 + osc(t, 2, 0.9) * 50, 4600, 1300);
  hx.globalAlpha = 1;
  mask(hx, 760, 520, 1);
  ctx.save(); ctx.globalAlpha = 0.85 * p; ctx.drawImage(hazeC, 0, 0); ctx.restore();
}

// ---------- haze ----------
const hazeC = off(), hx = hazeC.getContext('2d');
function drawHaze(t, s) {
  hx.clearRect(0, 0, W, H);
  hx.globalCompositeOperation = 'source-over';
  hx.globalAlpha = 1;
  // two layers drifting on closed loops, different speeds
  const ax = -600 + osc(t, 1) * 340, ay = osc(t, 1, 1.3) * 40;
  const bx = -700 + osc(t, 2, 0.7) * 260, by = osc(t, 1, 2.1) * 60;
  hx.drawImage(fogA, ax, ay - 60, 5200, 1200);
  hx.globalAlpha = 0.7; hx.drawImage(fogB, bx, by - 60, 5200, 1200);
  // lit only near the seam: warm falloff
  hx.globalAlpha = 1; hx.globalCompositeOperation = 'destination-in';
  hx.save(); hx.translate(CX, CY); hx.scale(1, 0.55);
  const r = 1500 + s * 600;
  const g = hx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.35, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  hx.fillStyle = g; hx.fillRect(-CX * 2, -H * 2, W * 2, H * 4); hx.restore();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.15 + 0.16 * s;
  ctx.drawImage(hazeC, 0, 0);
  ctx.restore();
}

// ---------- portal seam ----------
function drawSeam(t, s, sy) {
  const top = CY - 380, bot = CY + 380, h = bot - top;
  const breathe = 0.8 + 0.2 * (0.5 + 0.5 * osc(t, 4)) + 0.05 * osc(t, 11, 0.4);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // broad bloom
  ctx.save(); ctx.translate(CX, CY); ctx.scale(1, 1.6);
  let g = ctx.createRadialGradient(0, 0, 0, 0, 0, 760);
  g.addColorStop(0, `rgba(${WARM},${0.06 * breathe + 0.05 * s})`); g.addColorStop(0.4, `rgba(${WARM},${0.02 * breathe + 0.02 * s})`); g.addColorStop(1, `rgba(${WARM},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 760, 0, 7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(CX, CY); ctx.scale(1, 5.5);
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, 160);
  g.addColorStop(0, `rgba(${WARM},${0.09 * breathe + 0.07 * s})`); g.addColorStop(1, `rgba(${WARM},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 160, 0, 7); ctx.fill(); ctx.restore();
  // the swell: a soft ember glow sliding down the seam
  if (s > 0.001) {
    const yy = top + h * sy;
    ctx.save(); ctx.translate(CX, yy); ctx.scale(1, 2.6);
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, 240);
    g.addColorStop(0, `rgba(${EMBER},${0.16 * s})`); g.addColorStop(0.4, `rgba(${EMBER},${0.05 * s})`); g.addColorStop(1, `rgba(${EMBER},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 240, 0, 7); ctx.fill(); ctx.restore();
  }
  // the seam itself: tapered, soft, faint chromatic split
  const v = (rgb, a) => { const lg = ctx.createLinearGradient(0, top, 0, bot);
    lg.addColorStop(0, `rgba(${rgb},0)`); lg.addColorStop(0.25, `rgba(${rgb},${a})`);
    lg.addColorStop(0.5, `rgba(${rgb},${a * 1.15})`); lg.addColorStop(0.75, `rgba(${rgb},${a})`);
    lg.addColorStop(1, `rgba(${rgb},0)`); return lg; };
  const k = breathe + 0.6 * s;
  ctx.filter = 'blur(3px)';
  ctx.fillStyle = v('214,160,112', 0.16 * k); ctx.fillRect(CX - 7, top, 4, h);
  ctx.fillStyle = v('120,150,186', 0.14 * k); ctx.fillRect(CX + 3, top, 4, h);
  ctx.filter = 'blur(1px)';
  ctx.fillStyle = v('240,226,206', 0.42 * k); ctx.fillRect(CX - 1.25, top, 2.5, h);
  ctx.restore();
}

function draw(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const s = swell(t), sy = swellY(t);
  const light = 0.9 + 0.1 * osc(t, 4) + 0.8 * s;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.drawImage(bg, 0, 0);
  drawHaze(t, s);
  drawBat(t, light);
  drawHound(t, light);
  drawSeam(t, s, sy);
  ctx.drawImage(vig, 0, 0);
}
window.draw = draw;
window.ready = Promise.all([load('hound-graphite.png'), load('hound-edge.png'), load('fog-a.png'), load('fog-b.png')])
  .then(([a, b, c, d]) => { houndImg = a; houndEdge = b; fogA = c; fogB = d; })
  .then(() => Promise.all([load('neon-red.png'), load('neon-white.png')]))
  .then(([r, w]) => {
    neonRed = r; neonWhite = w;
    const tint = (img, color) => { const c = off(img.width, img.height), x = c.getContext('2d');
      x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height); return c; };
    fogDark = tint(fogB, '#030304');
    fogRed = tint(fogA, 'rgb(210,52,46)');
  });
</script>
</body>
</html>
